.idCardPreview{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-top:16px;align-items:flex-start}
.idCardWrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.idCardSideLabel{font-size:10.5px;font-weight:900;letter-spacing:1.8px;color:#8f9cb5;text-transform:uppercase}

.idCardFrontInner{padding:14px 16px 0;flex:1;display:flex;flex-direction:column;z-index:2;position:relative;justify-content:space-between}

.idCardFrontHeader{display:flex;flex-direction:column;gap:4px;width:100%}
.idCardFrontHeaderTop{display:flex;justify-content:space-between;align-items:center}
.idCardLogoGroup{display:flex;align-items:center;gap:6px}

.idCardTopMeta{display:flex;align-items:center;gap:6px}

.idCardInfoRight{color:#0f172a;font-weight:800;text-align:right}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return 'EP-'+(crypto.randomUUID?.().replaceAll('-','').slice(0,10).toUpperCase()||Math.random().toString(36).slice(2,12).toUpperCase())}
function nextSerial(){return users.reduce((m,u)=>Math.max(m,Number(u.serial)||0),0)+1}
function getHeadcounts(){
  const totalProfiles=users.length;
  const totalPersons=users.reduce((s,u)=>s+getGuestCount(u),0);
  const totalSub=users.reduce((s,u)=>s+Math.max(0,getGuestCount(u)-1),0);
  const checkedUsers=users.filter(u=>u.checkedIn);
  const checkedProfiles=checkedUsers.length;
  const checkedPersons=checkedUsers.reduce((s,u)=>s+getGuestCount(u),0);
  const checkedSub=checkedUsers.reduce((s,u)=>s+Math.max(0,getGuestCount(u)-1),0);
  const pendingProfiles=totalProfiles-checkedProfiles;
  const pendingPersons=totalPersons-checkedPersons;
  const pendingSub=totalSub-checkedSub;
  const rate=totalProfiles?Math.round(checkedProfiles/totalProfiles*100):0;
  const mealRate=totalPersons?Math.round(checkedPersons/totalPersons*100):0;
  return {totalProfiles,totalPersons,totalSub,checkedProfiles,checkedPersons,checkedSub,pendingProfiles,pendingPersons,pendingSub,rate,mealRate};
}
function normalizePhone(v){return String(v||'').replace(/\D/g,'')}
let audioCtx=null;
function initAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function playTone(freq,duration=0.12,delay=0,type='sine',volume=0.07){const ctx=initAudio();if(!ctx)return;const now=ctx.currentTime+delay;const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+duration+0.02)}
function playScanSound(kind){if(kind==='valid'||kind==='success'){playTone(880,0.10,0,'sine',0.08);playTone(1320,0.14,0.11,'sine',0.08);return}if(kind==='invalid'||kind==='error'){playTone(260,0.16,0,'square',0.06);playTone(190,0.20,0.15,'square',0.055);return}if(kind==='duplicate'){playTone(420,0.13,0,'triangle',0.06);playTone(300,0.18,0.13,'triangle',0.055);return}playTone(740,0.10,0,'sine',0.06)}
window.addEventListener('pointerdown',initAudio,{once:true,passive:true});
window.addEventListener('keydown',initAudio,{once:true,passive:true});
function toast(msg,type='ok'){const el=document.getElementById('toastRoot');const icon=type==='bad'?'!':type==='info'?'i':'✓';el.innerHTML='<div class="toast '+type+'">'+icon+' '+esc(msg)+'</div>';setTimeout(()=>el.innerHTML='',3200)}

  const inp=document.getElementById(inputId);
  if(!inp)return;
  if(inp.type==='password'){

async function submitAdminLogin(e){
  e.preventDefault();
  const val=document.getElementById('adminLoginPassword')?.value||'';
  if(!val){toast('Please enter password','bad');return}
  const hash=await hashText(val);
  const expected=settings.adminPasswordHash||'5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
  if(hash===expected){
    isAdmin=true;
    sessionStorage.setItem('eventpass_is_admin','true');
    closeModal();
    toast('Admin login successful! Welcome to Control Center. ✓');
    render();
  }else{
    toast('Incorrect admin password! Please try again.','bad');
    const inp=document.getElementById('adminLoginPassword');
    if(inp){inp.value='';inp.focus()}
  }
}

async function verifyIDCardAccess(e,id){
  e.preventDefault();
  const input=document.getElementById('checkIdCardPassword');
  const val=(input?.value||'').trim();
  const u=users.find(x=>x.guestId===id);
  if(!u)return;
  const adminHash=await hashText(val);
  const expectedAdminHash=settings.adminPasswordHash||'5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
  if(val===(u.idCardPassword||'1234') || adminHash===expectedAdminHash){
    closeModal();
    openIDCard(id);
    toast('পাসওয়ার্ড সঠিক হয়েছে! ✓');
  }else{
    toast('ভুল পাসওয়ার্ড! অনুগ্রহ করে সঠিক পাসওয়ার্ড দিন।','bad');

  }
}

function submitVolunteerLogin(e){
  e.preventDefault();
  const vid=document.getElementById('volLoginSelect')?.value;
  const pass=(document.getElementById('volLoginPassword')?.value||'').trim();
  const v=volunteers.find(x=>x.id===vid);
  if(!v){toast('Volunteer not found','bad');return}
  if(pass!==v.password && pass!=='12345'){
    toast('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন (ডিফল্ট: 1234)','bad');
    return;
  }
  currentVolunteer=v;
  isGateMode=true;
  sessionStorage.setItem('eventpass_volunteer_session',JSON.stringify(v));

function gateCheckIn(raw){
  const u=resolveGuest(raw);
  if(!u){
    gateScanResult={ok:false,message:'QR / Code not found',duplicate:false};
    updateGateResult();
    if(gateSoundEnabled)playScanSound('invalid');
    toast('QR not recognized / নিবন্ধিত নয়','bad');
    return false;
  }
  const count=getGuestCount(u);
  const sub=Math.max(0,count-1);
  const countDesc=sub>0?`সাব এ ${sub} জন, মোট ${count} জন`:`মোট ১ জন`;

  if(u.checkedIn){
    gateScanResult={ok:false,message:'Already Attended',duplicate:true,user:u};
    updateGateResult();
    if(gateSoundEnabled)playScanSound('duplicate');
    toast(`${u.name} — Already Attended (${u.scanner||'Gate'})`,'bad');
    return false;
  }

  gateScanResult={ok:true,user:u,confirmed:false};
  updateGateResult();
  if(gateSoundEnabled)playScanSound('valid');
  toast(`${u.name} পাওয়া গেছে — "গেস্ট চেক ইন" বাটনে ক্লিক করুন`);
  return true;
}

let currentCameraIndex = 0;
let availableCameras = [];

async function startGateScanner(){
  if(!window.Html5Qrcode)return;
  const el=document.getElementById('gateReader');
  if(!el)return;
  stopGateScanner();
  try{
    gateScanner=new Html5Qrcode('gateReader');
    const onScanSuccess=(decoded)=>{
      if(decoded&&decoded!==gateLastScan){
        gateLastScan=decoded;
        gateCheckIn(decoded);
        setTimeout(()=>gateLastScan='',2200);
      }
    };
    const scanConfig = {
      fps: 15,
      qrbox: (w, h) => {
        const edge = Math.max(180, Math.floor(Math.min(w, h) * 0.72));
        return { width: edge, height: edge };
      }
    };

    if(!availableCameras.length){
      try{ availableCameras = await Html5Qrcode.getCameras(); }catch(e){ availableCameras = []; }
    }

    if(availableCameras && availableCameras.length > 0){
      if(currentCameraIndex >= availableCameras.length) currentCameraIndex = 0;
      const cam = availableCameras[currentCameraIndex];
      await gateScanner.start(cam.id, scanConfig, onScanSuccess, ()=>{});
    }else{
      await gateScanner.start({ facingMode: "environment" }, scanConfig, onScanSuccess, ()=>{});
    }
  }catch(err){
    console.warn('Gate primary camera start failed, fallback to environment facingMode...', err);
    try{
      const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };
      await gateScanner.start({ facingMode: "environment" }, scanConfig, (decoded)=>{
        if(decoded&&decoded!==gateLastScan){
          gateLastScan=decoded;
          gateCheckIn(decoded);
          setTimeout(()=>gateLastScan='',2200);
        }
      }, ()=>{});
    }catch(err2){
      console.error('All camera attempts failed:', err2);
    }
  }
}

async function switchGateCamera(){
  if(!window.Html5Qrcode)return;
  try{
    if(!availableCameras.length){
      availableCameras = await Html5Qrcode.getCameras();
    }
    if(availableCameras && availableCameras.length > 1){
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      toast(`ক্যামেরা পরিবর্তন করা হচ্ছে... (${availableCameras[currentCameraIndex].label || 'Camera ' + (currentCameraIndex+1)})`);
      startGateScanner();
    }else{
      toast('এই ডিভাইসে অন্য কোনো ক্যামেরা পাওয়া যায়নি');
    }
  }catch(e){
    toast('ক্যামেরা পরিবর্তন করা যায়নি','bad');
  }
}

async function scanGateImage(input){
  const file = input?.files?.[0];
  if(!file) return;
  toast('ছবি থেকে কিউআর রিড করা হচ্ছে...','info');
  try{
    const tempScanner = new Html5Qrcode('gateReader');
    const decoded = await tempScanner.scanFile(file, true);
    if(decoded){
      gateCheckIn(decoded);
    }else{
      toast('ছবিতে কোনো কিউআর কোড পাওয়া যায়নি','bad');
    }
  }catch(err){
    try{
      if(gateScanner){
        const decoded = await gateScanner.scanFile(file, true);
        if(decoded) gateCheckIn(decoded);
        else toast('ছবিতে কিউআর পাওয়া যায়নি','bad');
      }else{
        toast('কিউআর রিড করা যায়নি: ' + (err.message || 'Invalid image'),'bad');
      }
    }catch(e2){
      toast('কিউআর রিড করা যায়নি: ' + (e2.message || 'Invalid image'),'bad');
    }
  }
  input.value = '';
}

function stopGateScanner(){
  try{
    if(gateScanner){
      gateScanner.stop().then(()=>gateScanner.clear()).catch(()=>{});
      gateScanner=null;
    }
  }catch{}
}

function submitVolunteer(e, id){
  e.preventDefault();
  const f=new FormData(e.target);
  const name=f.get('name').trim();
  const gate=f.get('gate').trim();
  const email=f.get('email').trim();
  const phone=f.get('phone').trim();
  const password=f.get('password').trim();

  if(id){
    const v=volunteers.find(x=>x.id===id);
    if(!v)return;
    v.name=name;
    v.gate=gate;
    v.email=email;
    v.phone=phone;
    v.password=password;
    saveVolunteers();
    closeModal();
    toast('Volunteer details updated ✓');
    render();
  }else{
    const newId='VOL-'+String(volunteers.length+1).padStart(2,'0');
    volunteers.push({
      id:newId,
      name,
      gate,
      email,
      phone,
      password,
      active:true,
      createdAt:new Date().toISOString()
    });
    saveVolunteers();
    closeModal();
    toast(`Volunteer ${name} added successfully ✓`);
    render();
  }
}

function deleteVolunteer(id){
  const v=volunteers.find(x=>x.id===id);
  if(!v)return;
  if(confirm(`Are you sure you want to delete volunteer "${v.name}"?`)){
    volunteers=volunteers.filter(x=>x.id!==id);
    saveVolunteers();
    toast(`Volunteer ${v.name} deleted`);
    render();
  }
}

function launchVolunteerGate(id){
  const v=volunteers.find(x=>x.id===id);
  if(!v)return;
  currentVolunteer=v;
  isGateMode=true;
  sessionStorage.setItem('eventpass_volunteer_session',JSON.stringify(v));
  render();
  toast(`Switched to Gate Mode as ${v.name}`);
}

function resolveGuest(raw){
  if(!raw)return null;
  reloadUsersFromStorage();
  const clean=String(raw).trim();
  const lower=clean.toLowerCase();

  // 1. Direct match with qrValue
  let found=users.find(u=>u.qrValue && u.qrValue.trim().toLowerCase()===lower);
  if(found)return found;

  // 2. Parse EVENTPASS format
  if(clean.toUpperCase().startsWith('EVENTPASS|')){
    const parts = clean.split('|');
    const guestId = (parts[1] || '').trim();
    const guestIdLower = guestId.toLowerCase();

    // Match by guestId in existing database
    if(guestId){
      found = users.find(u=>u.guestId && u.guestId.trim().toLowerCase()===guestIdLower);
      if(found) return found;
    }
    // Match by code in existing database
    if(parts[5]){
      const c = parts[5].trim().toLowerCase();
      found = users.find(u=>u.code && u.code.trim().toLowerCase()===c);
      if(found) return found;
    }

    // IF NOT IN LOCAL DATABASE, BUT HAS SELF-CONTAINED GUEST DATA:
    // (This happens when guest was registered on a Laptop, and scanned on a Mobile Phone!)
    if(parts.length >= 3 && guestId){
      let name = 'Registered Guest';
      try{ name = decodeURIComponent(parts[2] || 'Registered Guest'); }catch(e){ name = parts[2] || 'Registered Guest'; }
      let sscBatch = '';
      try{ sscBatch = decodeURIComponent(parts[3] || ''); }catch(e){ sscBatch = parts[3] || ''; }
      const personCount = Math.max(1, parseInt(parts[4] || '1', 10) || 1);
      const code = (parts[5] || `EVT-${guestId.slice(-4)}`).trim();
      let guestType = 'Individual';
      try{ guestType = decodeURIComponent(parts[6] || 'Individual'); }catch(e){ guestType = parts[6] || 'Individual'; }

      // Auto-register this guest into this device's storage so it is recognized!
      const autoImported = {
        serial: nextSerial(),
        guestId: guestId,
        name: name,
        phone: '',
        email: '',
        sscBatch: sscBatch,
        idCardPassword: '1234',
        personCount: personCount,
        profilePhoto: '',
        entryType: 'Guest',
        guestType: guestType,
        code: code,
        qrValue: clean,
        checkedIn: false,
        checkedAt: null,
        scanner: null,
        createdAt: new Date().toISOString()
      };
      users.push(autoImported);
      save();
      toast(`গেস্ট ডাটা লোড হয়েছে: ${name} (${personCount} জন) ✓`,'info');
      return autoImported;
    }

    if(guestId){
      found = users.find(u=>u.guestId && u.guestId.trim().toLowerCase()===guestIdLower);
      if(found) return found;
    }
  }

  // 3. Fallback matching across all fields: guestId, code, serial, phone
  found=users.find(u=>
    (u.guestId && u.guestId.trim().toLowerCase()===lower) ||
    (u.code && u.code.trim().toLowerCase()===lower) ||
    String(u.serial)===clean ||
    (u.phone && u.phone.replace(/[^0-9]/g,'')===clean.replace(/[^0-9]/g,''))
  );
  return found || null;
}

function resizeImage(file,size=600){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        c.width=size;
        c.height=size;
        const ctx=c.getContext('2d');
        const minDim=Math.min(img.width,img.height);
        const sx=(img.width-minDim)/2;
        const sy=img.height>img.width?Math.max(0,(img.height-minDim)*0.18):(img.height-minDim)/2;
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,size,size);
        ctx.drawImage(img,sx,sy,minDim,minDim,0,0,size,size);
        resolve(c.toDataURL('image/jpeg',0.88));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

          const minDim=Math.min(img.width,img.height);
          const sx=(img.width-minDim)/2;
          const sy=img.height>img.width?Math.max(0,(img.height-minDim)*0.18):(img.height-minDim)/2;
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,size,size);

async function downloadIDCardPDF(id){
  const u=users.find(x=>x.guestId===id);
  if(!u)return;
  toast('Generating high-resolution PDF...','info');
  try{
    const frontEl=document.getElementById('idCardFrontToRender');
    const backEl=document.getElementById('idCardBackToRender');
    if(!frontEl||!backEl)throw new Error('Card elements missing');

    const [frontCanvas,backCanvas]=await Promise.all([
      html2canvas(frontEl,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false}),
      html2canvas(backEl,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false})
    ]);

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[85,122.5]});
    pdf.addImage(frontCanvas.toDataURL('image/jpeg',0.98),'JPEG',0,0,85,122.5);
    pdf.addPage([85,122.5],'portrait');
    pdf.addImage(backCanvas.toDataURL('image/jpeg',0.98),'JPEG',0,0,85,122.5);

    const safeName=(u.name||'Guest').trim().replace(/[^a-zA-Z0-9_\-\u0980-\u09FF]/g,'_');
    pdf.save(`${safeName}_ID_Card.pdf`);
    toast('PDF downloaded successfully! ✓');
  }catch(err){
    console.error('PDF error:',err);
    toast('PDF generation failed: '+(err.message||'Please try again'),'bad');
  }
}

async function downloadIDCardImage(id,side){
  const u=users.find(x=>x.guestId===id);
  if(!u)return;
  toast(`Generating ${side==='front'?'Front':'Back'} image...`,'info');
  try{
    const el=document.getElementById(side==='front'?'idCardFrontToRender':'idCardBackToRender');
    if(!el)throw new Error('Card element missing');
    const canvas=await html2canvas(el,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false});
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    const safeName=(u.name||'Guest').trim().replace(/[^a-zA-Z0-9_\-\u0980-\u09FF]/g,'_');
    a.download=`${safeName}_ID_Card_${side}.png`;
    a.click();
    toast(`${side==='front'?'Front':'Back'} image downloaded! ✓`);
  }catch(err){
    console.error('Image error:',err);
    toast('Download failed: '+(err.message||'Please try again'),'bad');
  }
}

        </label>

    <div style="background:#131c31;border:1px solid #233454;border-radius:12px;padding:14px;font-size:12.5px;color:#a5b4fc;line-height:1.6">
      💡 <b>স্মার্ট কিউআর প্রযুক্তি:</b> আমাদের নতুন স্মার্ট কিউআরে অতিথির নাম, ব্যাচ ও ব্যক্তি সংখ্যা সরাসরি কিউআর কোডের ভেতরেই এনকোড করা থাকে। তাই মোবাইলে ডাটাবেজ ট্রান্সফার না করলেও কিউআর কোড স্ক্যান করলে স্বয়ংক্রিয়ভাবে অতিথি শনাক্ত হয়ে যায়!
    </div>
  `);
}
function importSyncFile(input){
  const file = input?.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data && Array.isArray(data.users)){
        const incoming = data.users;
        let added = 0, updated = 0;
        incoming.forEach(inc => {
          const idx = users.findIndex(u => u.guestId === inc.guestId);
          if(idx >= 0){
            users[idx] = { ...users[idx], ...inc };
            updated++;
          }else{
            users.push(inc);
            added++;
          }
        });
        save();
        closeModal();
        render();
        toast(`ডাটা সিঙ্ক সফল! ${added} জন নতুন গেস্ট যুক্ত হয়েছে, ${updated} জন আপডেট হয়েছে ✓`);
      }else{
        toast('অবৈধ ফাইল ফরম্যাট! সঠিক eventpass-sync-data.json ফাইল দিন।','bad');
      }
    }catch(err){
      toast('ফাইল পড়তে ব্যর্থ হয়েছে: ' + err.message, 'bad');
    }
  };
  reader.readAsText(file);
}

function settingsHTML(){return `<section class="content settingsSection"><div class="panel formPanel"><span class="eyebrow">EVENT CONFIGURATION</span><h2>Event & Owner Settings</h2><p>Set event details, published date & time, venue and security password. Changes automatically reflect on all ID cards.</p><div class="formGrid"><label class="field"><span>Event name <b style="color:#ff8a8a">*</b></span><input id="sName" value="${esc(settings.eventName)}" placeholder="হীরক জয়ন্তী ২০২৭"></label><label class="field"><span>School / College / Institute Name</span><input id="sInstitute" value="${esc(settings.instituteName||settings.venue||defaults.instituteName)}" placeholder="অলিপুর আমডাঙ্গা স্কুল এন্ড কলেজ"><small>আইডি কার্ডের ফ্রন্ট ও ব্যাক পেজের উপরে বড় করে প্রদর্শিত হবে।</small></label><label class="field"><span>Event date <b style="color:#ff8a8a">*</b></span><input type="date" id="sDate" value="${esc(settings.eventDate)}"></label><label class="field"><span>Event time <b style="color:#ff8a8a">*</b></span><input id="sTime" value="${esc(settings.eventTime||'10:00 AM')}" placeholder="e.g. 10:00 AM"></label><label class="field"><span>Venue <b style="color:#ff8a8a">*</b></span><input id="sVenue" value="${esc(settings.venue)}" placeholder="Event Venue"></label><label class="field"><span>Organized By</span><input id="sOrganizedBy" value="${esc(settings.organizedBy||'SSC Batch 2018 Alumni')}" placeholder="e.g. SSC Batch 2018 Alumni"></label><label class="field"><span>Event Slogan (Front side)</span><input id="sEventSlogan" value="${esc(settings.eventSlogan||'Reconnect · Remember · Relive')}" placeholder="e.g. Reconnect · Remember · Relive"></label><label class="field"><span>Event Quote (Back side)</span><input id="sEventQuote" value="${esc(settings.eventQuote||'Same Friends New Stories')}" placeholder="e.g. Same Friends New Stories"></label><label class="field"><span>Event Motto (Wave footer)</span><input id="sEventMotto" value="${esc(settings.eventMotto||'A GREATER TOMORROW THROUGH FRIENDSHIP')}" placeholder="Motto text"></label><label class="field"><span>Scanner name</span><input id="sScanner" value="${esc(settings.scannerName)}"></label><label class="field"><span>Owner / Client name</span><input id="sOwnerName" value="${esc(settings.ownerName||'')}" placeholder="Event Owner"></label><label class="field"><span>Owner / Client email</span><input type="email" id="sOwnerEmail" value="${esc(settings.ownerEmail||'')}" placeholder="owner@example.com"></label><label class="field"><span>Owner / Client phone</span><input id="sOwnerPhone" value="${esc(settings.ownerPhone||'')}" placeholder="+8801XXXXXXXXX"></label></div><div class="settingsBlock"><h3>Email QR delivery</h3><p>For a real email with the QR image embedded, connect EmailJS below. The email service account controls the actual sender mailbox; the owner email is used as the reply-to/contact address.</p><div class="formGrid"><label class="field"><span>EmailJS Public Key</span><input id="sEmailPublic" value="${esc(settings.emailPublicKey||'')}" placeholder="Your EmailJS public key"></label><label class="field"><span>EmailJS Service ID</span><input id="sEmailService" value="${esc(settings.emailServiceId||'')}" placeholder="service_xxxxx"></label><label class="field"><span>EmailJS Template ID</span><input id="sEmailTemplate" value="${esc(settings.emailTemplateId||'')}" placeholder="template_xxxxx"></label><label class="field"><span>QR image size</span><input id="sQrSize" value="${esc(settings.qrSize||'400')}" inputmode="numeric" placeholder="400"></label></div><div class="formActions"><button class="secondary" onclick="testEmailConfig()">Send test email</button></div></div><div class="settingsBlock"><h3>🔐 Admin Password &amp; Security</h3><p>অ্যাডমিন পাসওয়ার্ড দিয়ে কন্ট্রোল সেন্টার, সেটিংস এবং গেস্ট ডিলিট সুরক্ষিত থাকে। ডিফল্ট পাসওয়ার্ড: <b>12345</b>। নিচে বর্তমান ও নতুন পাসওয়ার্ড দিয়ে পরিবর্তন করতে পারেন।</p><div class="formGrid"><label class="field"><span>Current / Old Admin Password</span><div class="passwordWrap"><input type="password" id="sOldAdminPassword" placeholder="Enter current password (default: 12345)"><button type="button" class="toggleEyeBtn" onclick="togglePasswordVisibility('sOldAdminPassword', this)" title="Show/Hide password">${EYE_OPEN_SVG}</button></div><small>পাসওয়ার্ড পরিবর্তনের জন্য বর্তমান পাসওয়ার্ড দিতে হবে।</small></label><label class="field"><span>New Admin Password</span><div class="passwordWrap"><input type="password" id="sNewAdminPassword" placeholder="Leave blank to keep current"><button type="button" class="toggleEyeBtn" onclick="togglePasswordVisibility('sNewAdminPassword', this)" title="Show/Hide password">${EYE_OPEN_SVG}</button></div><small>পরিবর্তন করতে না চাইলে ফাঁকা রাখুন (সর্বনিম্ন ৪ অক্ষর)।</small></label></div></div><div class="formActions"><button class="primary" onclick="saveSettings()">Save settings</button></div></div><div class="panel note"><h3>One-time QR verification</h3><p>Every guest has an immutable serial number, permanent Guest ID, unique entry code and QR value. The first valid scan changes the status to Verified / Attended and stores the scanner name + time. Any later scan shows <b>Already Attended</b> and is blocked. All Guests and Checked In are separate views.</p></div></section>`}
async function saveSettings(){
  const oldPass=document.getElementById('sOldAdminPassword')?.value||'';
  const newPass=document.getElementById('sNewAdminPassword')?.value||'';
  if(newPass){
    if(!oldPass){toast('Please enter current admin password to set a new password','bad');return}
    const oldHash=await hashText(oldPass);
    const expected=settings.adminPasswordHash||'5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
    if(oldHash!==expected){toast('Current admin password is incorrect!','bad');return}
    if(newPass.length<4){toast('New password must be at least 4 characters','bad');return}
    settings.adminPasswordHash=await hashText(newPass);
    toast('Admin password updated successfully! ✓');
  }
  settings={
    ...settings,
    eventName:document.getElementById('sName').value||defaults.eventName,
    instituteName:document.getElementById('sInstitute')?.value||document.getElementById('sVenue')?.value||defaults.instituteName,
    eventDate:document.getElementById('sDate').value||defaults.eventDate,
    eventTime:document.getElementById('sTime').value||defaults.eventTime,
    venue:document.getElementById('sVenue').value||'',
    organizedBy:document.getElementById('sOrganizedBy').value||defaults.organizedBy,
    eventSlogan:document.getElementById('sEventSlogan').value||defaults.eventSlogan,
    eventQuote:document.getElementById('sEventQuote').value||defaults.eventQuote,
    eventMotto:document.getElementById('sEventMotto').value||defaults.eventMotto,
    scannerName:document.getElementById('sScanner').value||'Front Desk',
    ownerName:document.getElementById('sOwnerName').value||'',
    ownerEmail:document.getElementById('sOwnerEmail').value||'',
    ownerPhone:document.getElementById('sOwnerPhone').value||'',
    emailPublicKey:document.getElementById('sEmailPublic').value.trim(),
    emailServiceId:document.getElementById('sEmailService').value.trim(),
    emailTemplateId:document.getElementById('sEmailTemplate').value.trim(),
    qrSize:document.getElementById('sQrSize').value.replace(/\D/g,'')||'400'
  };
  save();
  toast('Settings saved');
  render();
}
function qrImageUrl(u,size=settings.qrSize||'400'){return 'https://api.qrserver.com/v1/create-qr-code/?size='+encodeURIComponent(size)+'x'+encodeURIComponent(size)+'&data='+encodeURIComponent(u.qrValue)}
function emailParams(u){const qr=qrImageUrl(u);return {to_email:u.email,to_name:u.name,reply_to:settings.ownerEmail||'',from_name:settings.ownerName||settings.eventName,owner_name:settings.ownerName||settings.eventName,owner_email:settings.ownerEmail||'',owner_phone:settings.ownerPhone||'',event_name:settings.eventName,event_date:fmtDateTime(settings.eventDate,settings.eventTime),venue:settings.venue,guest_name:u.name,guest_serial:String(u.serial).padStart(2,'0'),guest_number:'#'+String(u.serial).padStart(2,'0'),guest_id:u.guestId,entry_code:u.code,qr_code:qr,qr_url:qr,message:inviteMessage(u)}}
async function sendGuestEmail(id){const u=users.find(x=>x.guestId===id);if(!u)return;if(!settings.emailPublicKey||!settings.emailServiceId||!settings.emailTemplateId){toast('Set EmailJS Public Key, Service ID and Template ID in Settings first','bad');navigate('settings');return}try{if(window.emailjs)window.emailjs.init({publicKey:settings.emailPublicKey});await emailjs.send(settings.emailServiceId,settings.emailTemplateId,emailParams(u));toast('QR email sent to '+u.email)}catch(err){toast('Email send failed. Check EmailJS settings/template.','bad');console.error(err)}}
async function testEmailConfig(){const email=settings.ownerEmail||prompt('Enter a test email address');if(!email)return;if(!settings.emailPublicKey||!settings.emailServiceId||!settings.emailTemplateId){toast('Fill EmailJS Public Key, Service ID and Template ID first','bad');return}const fake={name:settings.ownerName||'Event Owner',email,serial:0,guestId:'TEST-GUEST',code:'TEST-0000',qrValue:'EVENTPASS|TEST-GUEST'};try{if(window.emailjs)window.emailjs.init({publicKey:settings.emailPublicKey});await emailjs.send(settings.emailServiceId,settings.emailTemplateId,emailParams(fake));toast('Test email sent')}catch(err){toast('Test email failed. Check your EmailJS template variables.','bad');console.error(err)}}
function exportCSV(){
  const rows=[['Serial','Permanent Guest ID','Name','Total Persons','Primary Guest','Sub-Guests','Guest Type','Entry Type','Entry Code','ID Card Pass','Phone','Email','Status','Checked At','Scanner'],...users.sort((a,b)=>a.serial-b.serial).map(u=>{const c=getGuestCount(u);const sub=Math.max(0,c-1);return [u.serial,u.guestId,u.name,c,1,sub,u.guestType||'Individual',u.entryType||'General',u.code,u.idCardPassword||'1234',u.phone,u.email,u.checkedIn?'Checked in':'Pending',u.checkedAt?new Date(u.checkedAt).toLocaleString():'',u.scanner||'']})];
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='event-guests.csv';
  a.click();
}
function fmtDate(v){try{return new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch{return v}}
function fmtDateTime(d,t){const dp=fmtDate(d);return t&&String(t).trim()?`${dp} · ${String(t).trim()}`:dp}
let lastStoredUsersRaw = localStorage.getItem(USERS_KEY) || '';
function syncFromStorage(){
  try{
    const currentRaw = localStorage.getItem(USERS_KEY) || '';
    if(currentRaw !== lastStoredUsersRaw){
      lastStoredUsersRaw = currentRaw;
      reloadUsersFromStorage();
      refreshLiveViews();
    }
  }catch(e){}
}
function refreshLiveViews(){
  if(isGateMode && currentVolunteer){
    const v=currentVolunteer;
    const vScans=users.filter(x=>x.checkedIn && x.scanner && x.scanner.includes(v.name));
    const totalGatePersons=vScans.reduce((s,x)=>s+getGuestCount(x),0);
    const statsPill=document.querySelector('.gateStatsPill');
    if(statsPill)statsPill.innerHTML=`📊 Scanned: <b>${vScans.length}</b> (${totalGatePersons} জন)`;
    const recentList=document.querySelector('.gateRecentList');
    if(recentList){
      const recentGateScans=[...vScans].sort((a,b)=>new Date(b.checkedAt)-new Date(a.checkedAt)).slice(0,8);
      recentList.innerHTML=recentGateScans.length ? recentGateScans.map(gx=>{
        const c=getGuestCount(gx);
        return `
          <div class="gateRecentItem">
            <div>
              <b style="color:#fff;display:block">${esc(gx.name)}</b>
              <small style="color:#94a3b8">#${String(gx.serial).padStart(2,'0')} · Batch ${esc(gx.sscBatch||'—')}</small>

              <span style="background:#064e3b;color:#6ee7b7;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;display:inline-block">👥 ${c} জন</span>
              <small style="display:block;color:#64748b;margin-top:2px">${new Date(gx.checkedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small>

    }
    return;
  }
  if(!isAdmin){
    renderPublicLookup();

  if(tab==='dashboard'){
    const content=document.querySelector('.content');
    if(content && content.parentElement){
      const h=getHeadcounts();
      content.parentElement.innerHTML=`<header><div><span class="eyebrow">EVENT CONTROL CENTER</span><h1>Dashboard</h1></div><div class="headerActions"><span class="adminBadge">🔐 ADMIN</span><div class="eventChip"><span>EVENT</span><b>${esc(settings.eventName)}</b></div><button class="primary" onclick="openAdd()">＋ Add Guest</button><button class="secondary logoutBtn" onclick="logoutAdmin()" title="Logout Admin">🔓 Logout</button></div></header>${dashboardHTML(h)}`;
    }
  }else if(tab==='guests'){
    renderGuestsOnly();
  }
}

  if(!e.key || e.key === USERS_KEY || e.key === SETTINGS_KEY){
