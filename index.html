.idCardFront{height:100%;display:flex;flex-direction:column;background:#ffffff;position:relative;overflow:hidden;box-sizing:border-box;justify-content:space-between}
.idCardFrontInner{padding:14px 16px 0;flex:1;display:flex;flex-direction:column;z-index:2;position:relative;justify-content:space-between}

.idCardFrontHeader{display:flex;flex-direction:column;gap:4px;width:100%}
.idCardFrontHeaderTop{display:flex;justify-content:space-between;align-items:center}
.idCardLogoGroup{display:flex;align-items:center;gap:6px}
.idCardBrandSmall{font-size:10.5px;font-weight:900;letter-spacing:1px;color:#1e3a8a}
.idCardTopMeta{display:flex;align-items:center;gap:6px}
.idCardEntryBadge{background:#e0e7ff;color:#1d4ed8;font-size:9px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:0.5px;text-transform:uppercase}
.idCardBatchTag{display:flex;align-items:baseline;gap:3px;font-size:9px;color:#64748b;font-weight:700}
.idCardBatchTag small{font-size:7.5px;text-transform:uppercase;color:#64748b;font-weight:800}
.idCardBatchTag b{font-size:11.5px;color:#0f172a;font-weight:900}

.idCardInstituteAndEvent{text-align:center;margin-top:2px;padding:2px 0}
.idCardInstituteTitle{font-size:12.5px;font-weight:800;color:#2563eb;line-height:1.25;letter-spacing:0.1px}
.idCardEventTitle{font-size:18px;font-weight:900;color:#0f172a;letter-spacing:-0.2px;line-height:1.2;margin-top:2px}

.idCardPhotoSection{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:2px auto 3px;text-align:center;width:100%;flex-shrink:0}
.idCardPhotoRing{width:104px;height:104px;min-width:104px;min-height:104px;max-width:104px;max-height:104px;aspect-ratio:1/1;border-radius:50%;padding:3.5px;background:linear-gradient(135deg,#e2e8f0,#cbd5e1);box-shadow:0 8px 20px rgba(37,99,235,0.18);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;flex-shrink:0}
.idCardPhotoImg{width:97px;height:97px;min-width:97px;min-height:97px;max-width:97px;max-height:97px;aspect-ratio:1/1;border-radius:50%;object-fit:cover;object-position:center 20%;background:#f1f5f9;display:block;border:2.5px solid #ffffff;box-sizing:border-box;flex-shrink:0}
.idCardPhotoAvatar{width:97px;height:97px;min-width:97px;min-height:97px;max-width:97px;max-height:97px;aspect-ratio:1/1;border-radius:50%;background:#e0e7ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;border:2.5px solid #ffffff;box-sizing:border-box;flex-shrink:0}

.idCardNameTitle{font-size:17.5px;font-weight:900;color:#0f172a;letter-spacing:-0.3px;margin-top:7px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%;flex-shrink:0}

.idCardInfoCard{background:#f4f7fb;border-radius:11px;padding:6px 12px;margin-top:4px;border:1px solid #e8eef6;display:flex;flex-direction:column;gap:2.5px}
.idCardInfoRow{display:flex;align-items:center;justify-content:space-between;padding:1px 0;font-size:9.5px}
.idCardInfoLeft{display:flex;align-items:center;gap:6px;color:#475569;font-weight:700}
.idCardInfoLeft svg{width:12px;height:12px;color:#2563eb;flex-shrink:0}
.idCardInfoRight{color:#0f172a;font-weight:800;text-align:right}

/* Wave Footer */
.idCardWaveWrap{margin-top:auto;position:relative;width:100%;height:58px;overflow:hidden;flex-shrink:0}
.idCardWaveWrap svg{position:absolute;left:0;bottom:0;width:100%;height:58px;display:block}
.idCardWaveText{position:absolute;left:0;right:0;bottom:7px;text-align:center;color:#ffffff;z-index:3}
.idCardWaveBrand{font-size:9px;font-weight:900;letter-spacing:2.5px;color:#ffffff}
.idCardWaveMotto{font-size:5.8px;letter-spacing:0.8px;color:#bfdbfe;margin-top:1px;font-weight:700;opacity:0.95}

/* Back Side */
.idCardBack{height:100%;display:flex;flex-direction:column;background:#ffffff;position:relative;overflow:hidden;box-sizing:border-box;justify-content:space-between}
.idCardBackInner{padding:14px 16px 0;flex:1;display:flex;flex-direction:column;z-index:2;position:relative;justify-content:space-between}

.idCardBackTop{display:flex;justify-content:space-between;align-items:center;padding-bottom:2px}
.idCardBackTopLeft{display:flex;flex-direction:column;text-align:left}
.idCardBackInstitute{font-size:10.5px;font-weight:800;color:#2563eb;line-height:1.2}
.idCardBackEvent{font-size:14.5px;font-weight:900;color:#0f172a;letter-spacing:-0.2px;margin-top:1px}
.idCardBackTopRight{text-align:right}
.idCardBackEntryBadge{display:inline-block;background:#2563eb;color:#ffffff;font-size:9.5px;font-weight:900;letter-spacing:0.8px;padding:3.5px 10px;border-radius:6px;text-transform:uppercase;box-shadow:0 2px 6px rgba(37,99,235,0.25)}

.idCardBackQuote{font-style:italic;font-family:Georgia,serif;font-size:11px;font-weight:700;color:#1e3a8a;text-align:center;margin:3px 0 2px}

.idCardQrBox{background:#ffffff;padding:6px;border-radius:14px;box-shadow:0 6px 20px rgba(37,99,235,0.12);border:1px solid #e2e8f0;width:116px;height:116px;margin:0 auto;display:grid;place-items:center}
.idCardQrBox>div{width:104px;height:104px;display:grid;place-items:center}
.idCardQrBox canvas, .idCardQrBox img{width:104px!important;height:104px!important;display:block}

.idCardScanBadge{display:inline-block;background:#2563eb;color:#ffffff;border-radius:999px;padding:3.5px 14px;font-size:8px;font-weight:900;letter-spacing:1.2px;margin:3px auto 0;text-align:center;box-shadow:0 3px 8px rgba(37,99,235,0.28)}

.idCardBackDetails{background:#f4f7fb;border-radius:12px;padding:6px 11px;margin-top:4px;border:1px solid #e8eef6;text-align:left;display:flex;flex-direction:column;gap:5px}
.idCardBackDetailItem{display:flex;align-items:flex-start;gap:8px}
.idCardBackDetailItem svg{width:13.5px;height:13.5px;color:#2563eb;flex-shrink:0;margin-top:1px}
.idCardBackDetailText{display:flex;flex-direction:column;gap:1px}
.idCardBackDetailLabel{font-size:7px;font-weight:800;color:#64748b;letter-spacing:0.6px;text-transform:uppercase}
.idCardBackDetailValue{font-size:9.5px;font-weight:800;color:#0f172a;line-height:1.25}

.idCardScriptRow{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 1px}
.idCardScriptLine{height:1px;background:#cbd5e1;flex:1}
.idCardScriptText{font-family:'Dancing Script',cursive;font-size:17px;font-weight:700;color:#475569}

/* Actions in Preview Modal */
.idCardActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.idCardActions button{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11.5px;padding:9px 15px;border-radius:10px}
.idCardActions .primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 8px 24px rgba(37,99,235,0.35)}
.closeActionBtn{background:#1e293b!important;border:1.5px solid #334466!important;color:#e2e8f0!important}
.closeActionBtn:hover{background:#ef4444!important;border-color:#ef4444!important;color:#fff!important}
.idCardHint{margin-top:12px;padding:10px 14px;background:#0a111e;border:1px dashed #26334b;border-radius:10px;color:#8595b0;font-size:10.5px;line-height:1.5;text-align:center}

@media(max-width:820px){
  .idCardPreview{flex-direction:column;align-items:center}
  .idCardModal{width:96vw}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .sidebar,header,.idCardActions,.idCardHint,.close,.modalHead,nav,#toastRoot{display:none!important}
  .main,.overlay,.modal.idCardModal{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;max-height:none!important;box-shadow:none!important;border:none!important;background:transparent!important}
  .idCardPreview{display:flex!important;flex-direction:column!important;gap:10mm!important;align-items:center!important;margin:8mm auto!important}
  .idCardWrap{page-break-inside:avoid!important;break-inside:avoid!important}
  .idCardWrap:nth-child(2){page-break-before:always!important;break-before:page!important}
  .idCard{box-shadow:none!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .idCardSideLabel{display:none!important}
}
.hidden{display:none!important}@media(max-width:1000px){.sidebar{width:78px;padding:20px 10px}.brand div:not(.mark){display:none}.brand{padding:0 8px 30px}.mark{margin:auto}nav button{justify-content:center;font-size:0}.main{margin-left:78px;width:calc(100% - 78px);padding:25px}.heroGrid,.scannerLayout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.main{padding:18px}.eventChip{display:none}.formGrid,.passGrid{grid-template-columns:1fr}.camera{height:420px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.stats{grid-template-columns:1fr 1fr}.guestTabsHead{align-items:flex-start;gap:12px;flex-direction:column}.segmented{width:100%}.segmented button{flex:1}.share>*{flex:1}}@media print{body{background:#fff;color:#111}.sidebar,header,.share,.danger,.close,.delivery{display:none!important}.main{margin:0;width:100%;padding:0}.overlay{position:static;background:#fff;padding:0}.modal{box-shadow:none;border:0;width:100%;color:#111}.infoRow{border-color:#ddd}.infoRow span{color:#555}}

/* Password wrap & eye toggle */
.passwordWrap{position:relative;display:flex;align-items:center;width:100%}
.passwordWrap input{padding-right:44px!important;width:100%!important}
.toggleEyeBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#8fa0be;padding:6px;display:grid;place-items:center;cursor:pointer;border-radius:7px;transition:color .2s;z-index:5}
.toggleEyeBtn:hover{color:#fff;background:rgba(255,255,255,0.08)}

/* Public Portal Styles */
.publicApp{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#161e38 0,#070b16 48%)}
.publicHeader{display:flex;justify-content:space-between;align-items:center;padding:18px 36px;background:rgba(9,14,26,0.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.publicBrand{display:flex;align-items:center;gap:12px}
.publicBrand .mark{width:38px;height:38px;border-radius:10px}
.publicBrand b{font-size:18px;letter-spacing:-.4px;color:#fff}
.publicBrand small{display:block;font-size:8px;letter-spacing:1.8px;color:#6fe1b2;font-weight:800}
.publicNav{display:flex;align-items:center;gap:10px}
.adminLoginBtn{background:#131b2e;border:1px solid #2a3b5c;color:#cbd5e1;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:9px 16px;border-radius:10px;cursor:pointer;transition:all .2s}
.adminLoginBtn:hover{background:#1c2742;color:#fff;border-color:#4f6a9e}
.publicMain{flex:1;max-width:1040px;width:100%;margin:0 auto;padding:36px 20px 70px;display:flex;flex-direction:column;gap:32px}
.publicHero{text-align:center;background:linear-gradient(180deg,#10192e 0%,#0c1322 100%);border:1px solid #23314f;border-radius:24px;padding:44px 28px 38px;box-shadow:0 25px 60px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06);position:relative;overflow:hidden}
.publicBadge{display:inline-flex;align-items:center;gap:6px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;font-size:10.5px;font-weight:800;letter-spacing:1.2px;padding:6px 14px;border-radius:999px;margin-bottom:16px;text-transform:uppercase}
.publicInstitute{font-size:19px;font-weight:800;color:#60a5fa;letter-spacing:.2px;margin-bottom:6px}
.publicEventTitle{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.2;margin:0 0 10px}
.publicSlogan{font-size:14px;color:#94a3b8;font-style:italic;margin-bottom:26px}
.publicMetaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:820px;margin:0 auto 32px}
.publicMetaItem{background:#080e1b;border:1px solid #1a273f;border-radius:14px;padding:14px 16px;text-align:center}
.publicMetaItem small{display:block;font-size:9.5px;font-weight:800;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.publicMetaItem b{font-size:13px;color:#e2e8f0;font-weight:800}
.bigCtaBtn{background:linear-gradient(135deg,#4f46e5 0%,#2563eb 50%,#1d4ed8 100%);color:#fff;border:0;padding:18px 36px;border-radius:14px;font-size:16px;font-weight:900;box-shadow:0 15px 35px rgba(37,99,235,0.4),inset 0 1px 0 rgba(255,255,255,0.25);display:inline-flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .2s cubic-bezier(0.16,1,0.3,1)}
.bigCtaBtn:hover{transform:translateY(-2px);box-shadow:0 20px 42px rgba(37,99,235,0.55)}
.bigCtaBtn small{font-size:11px;color:#c7d2fe;font-weight:600}
.publicLookupSection{background:#0d1422;border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.lookupHead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:14px}
.lookupHead h2{font-size:20px;color:#fff}
.lookupHead p{color:#7b889e;font-size:12.5px;margin-top:4px}
.publicSearchWrap{display:flex;align-items:center;background:#080d17;border:1.5px solid #23314d;border-radius:12px;padding:0 14px;width:min(380px,100%)}
.publicSearchWrap input{background:transparent!important;border:0!important;outline:0!important;padding:11px 10px!important;color:#fff!important;font-size:13px!important;width:100%!important}
.publicGuestGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.publicGuestCard{background:#080e1b;border:1px solid #1c2a44;border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.publicGuestTop{display:flex;gap:12px;align-items:center}
.publicGuestAvatar{width:46px;height:46px;min-width:46px;min-height:46px;max-width:46px;max-height:46px;aspect-ratio:1/1;border-radius:12px;object-fit:cover;background:#1a2238;border:1.5px solid #2d3b59;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:18px;color:#9da8ff;overflow:hidden;box-sizing:border-box}
.publicGuestInfo b{display:block;font-size:14px;color:#fff}
.publicGuestInfo small{display:block;font-size:11px;color:#7d8ea7;margin-top:2px}
.publicGuestActions{display:flex;gap:8px}
.publicGuestActions button{flex:1;padding:8px 10px;font-size:11.5px;font-weight:800;border-radius:8px}
.adminBadge{background:#1e1b4b;border:1px solid #4338ca;color:#a5b4fc;font-size:10.5px;font-weight:900;letter-spacing:1px;padding:6px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.logoutBtn{background:#1c1924!important;border-color:#3b2a3a!important;color:#fca5a5!important}
.logoutBtn:hover{background:#391e2b!important;border-color:#ef4444!important;color:#fff!important}

.volunteerScannerBtn{background:linear-gradient(135deg,#059669,#0d9488);color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:800;font-size:12.5px;box-shadow:0 8px 20px rgba(13,148,136,0.25);display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:all .2s}
.volunteerScannerBtn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 10px 25px rgba(13,148,136,0.35)}

/* Volunteer Gate Scanner Interface */
.gateContainer{min-height:100vh;background:#050811;color:#fff;display:flex;flex-direction:column;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}
.gateHeader{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:#0a101f;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
.gateHeaderBrand{display:flex;align-items:center;gap:12px}
.gateHeaderBrand .mark{width:36px;height:36px;border-radius:10px;font-size:14px;background:linear-gradient(135deg,#10b981,#059669)}
.gateHeaderTitle{display:flex;flex-direction:column}
.gateHeaderTitle b{font-size:14.5px;color:#fff}
.gateHeaderTitle small{font-size:10.5px;color:#94a3b8}
.gateHeaderActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gateVolunteerBadge{display:inline-flex;align-items:center;gap:6px;background:#064e3b;color:#6ee7b7;border:1px solid #059669;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800}
.gateStatsPill{background:#111e38;border:1px solid #23385d;color:#93c5fd;padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.gateSoundBtn{background:#182338;border:1px solid #2c3e60;color:#cbd5e1;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700}
.gateExitBtn{background:#2a161b!important;border:1px solid #54222c!important;color:#fca5a5!important;padding:6px 12px!important;border-radius:8px!important;font-size:11.5px!important;font-weight:800!important}
.gateExitBtn:hover{background:#45121c!important;color:#fff!important}

.gateMain{flex:1;max-width:1050px;margin:0 auto;width:100%;padding:22px 18px 60px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:20px;box-sizing:border-box}
.gateCameraCard{background:#0a1120;border:1.5px solid #1e2d4a;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gateCameraBox{background:#000;border-radius:14px;overflow:hidden;position:relative;border:1.5px solid #243555;min-height:330px;display:flex;align-items:center;justify-content:center}
.gateCameraBox video{width:100%!important;height:100%!important;object-fit:cover}
.gateScanFrame{position:absolute;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-50%);border:2.5px solid #10b981;border-radius:20px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,0.5)}
.gateLaserLine{position:absolute;left:10px;right:10px;height:2.5px;background:#34d399;box-shadow:0 0 14px #34d399;animation:gateLaserSweep 2s infinite ease-in-out}
@keyframes gateLaserSweep{0%,100%{top:10%}50%{top:90%}}

.gateManualWrap{display:flex;gap:8px;margin-top:2px}
.gateManualWrap input{flex:1;background:#080d18;border:1.5px solid #23314d;border-radius:10px;padding:10px 12px;color:#fff;font-size:13px;outline:0}
.gateManualWrap input:focus{border-color:#10b981}
.gateManualWrap button{background:#10b981;border:0;color:#052e16;padding:10px 16px;border-radius:10px;font-weight:900;font-size:12.5px;cursor:pointer}

.gateCardRight{display:flex;flex-direction:column;gap:18px}
.gateResultBox{background:#0a1120;border:1.5px solid #1e2d4a;border-radius:16px;padding:20px;min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.gateWaitBox{padding:20px 10px;color:#7e8ea6}
.gateWaitIcon{width:60px;height:60px;border-radius:50%;background:#102538;color:#38bdf8;font-size:26px;display:grid;place-items:center;margin:0 auto 12px;border:1.5px dashed #204163}

.gateResultCard{border-radius:14px;padding:18px;text-align:center;animation:gateCardPop .25s ease-out}
@keyframes gateCardPop{0%{transform:scale(0.96);opacity:0}100%{transform:scale(1);opacity:1}}
.gateResultCard.ok{background:linear-gradient(135deg,#064e3b,#022c22);border:2px solid #10b981;color:#ecfdf5}

.gateConfirmBtn{width:100%;padding:14px 18px;background:linear-gradient(135deg,#059669,#10b981);color:#ffffff;border:none;border-radius:10px;font-size:15px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(16,185,129,0.4);transition:all .15s ease;margin-top:14px}
.gateConfirmBtn:hover{background:linear-gradient(135deg,#047857,#059669);transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,0.5)}
.gateConfirmBtn:active{transform:translateY(1px)}
.gateCancelBtn{margin-top:8px;background:transparent;border:1px solid #334155;color:#94a3b8;font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
.gateCancelBtn:hover{background:#1e293b;color:#f1f5f9}

.gateGuestPhoto{width:70px;height:70px;min-width:70px;min-height:70px;max-width:70px;max-height:70px;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:3px solid #ffffff;margin:0 auto 10px;display:block;box-shadow:0 6px 16px rgba(0,0,0,0.4)}
.gateGuestAvatar{width:70px;height:70px;min-width:70px;min-height:70px;max-width:70px;max-height:70px;aspect-ratio:1/1;border-radius:50%;background:#1e293b;color:#a5b4fc;font-size:26px;font-weight:900;display:grid;place-items:center;margin:0 auto 10px;border:3px solid #ffffff}

<body>
<div id="root"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
// ==========================================================================
// 🌐 REALTIME CLOUD DATABASE (Google Firebase Realtime Database)
// ==========================================================================
// মোবাইল, ল্যাপটপ ও সকল ডিভাইসে রিয়েল-টাইমে লাইভ ডাটা সিঙ্কের জন্য
// আপনার Firebase প্রজেক্টের কনফিগ নিচে দিন। (সেটআপ করতে মাত্র ২ মিনিট লাগে)
// ==========================================================================
const FIREBASE_CONFIG_KEY='eventpass_firebase_config_v1';
const HARDCODED_FIREBASE_CONFIG={
  apiKey:"AIzaSyCtdromjFLukFpvdjxr_mj-XpnwoK7-5qE",
  authDomain:"alipur-event.firebaseapp.com",
  databaseURL:"https://alipur-event-default-rtdb.firebaseio.com",
  projectId:"alipur-event",
  storageBucket:"alipur-event.firebasestorage.app",
  messagingSenderId:"601515072069",
  appId:"1:601515072069:web:0b8f98576553fc028fa12c",
  measurementId:"G-BPXB9EP6L2"
};

let firebaseApp=null;
let firebaseDb=null;
let firebaseFirestore=null;
let activeCloudEngine='none'; // 'firestore' | 'rtdb' | 'none'
let isCloudActive=false;
let cloudSyncStatus='offline'; // 'offline' | 'connecting' | 'connected' | 'error'
let cloudSyncMessage='লোকাল মোডে চলছে (ক্লাউড সেটআপ করতে ক্লিক করুন)';

function getFirebaseConfig(){
  if(HARDCODED_FIREBASE_CONFIG && (HARDCODED_FIREBASE_CONFIG.databaseURL || HARDCODED_FIREBASE_CONFIG.apiKey || HARDCODED_FIREBASE_CONFIG.projectId)){
    return HARDCODED_FIREBASE_CONFIG;
  }
  try{
    const saved=JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY));
    if(saved && (saved.databaseURL || saved.apiKey || saved.projectId)) return saved;
  }catch(e){}
  return null;
}

function initFirebase(cfg=null){
  const config=cfg||getFirebaseConfig();
  if(!config || (!config.databaseURL && !config.apiKey && !config.projectId)){
    isCloudActive=false;
    cloudSyncStatus='offline';
    cloudSyncMessage='লোকাল মোডে চলছে (ক্লাউড সেটআপ করতে ক্লিক করুন)';
    updateCloudStatusUI();
    return;
  }
  if(typeof firebase==='undefined'){
    console.warn('Firebase SDK not loaded');
    cloudSyncStatus='error';
    cloudSyncMessage='Firebase SDK লোড হয়নি।';
    updateCloudStatusUI();
    return;
  }
  try{
    cloudSyncStatus='connecting';
    cloudSyncMessage='ক্লাউড ডাটাবেজে যুক্ত হচ্ছে...';
    updateCloudStatusUI();

    if(!firebase.apps || !firebase.apps.length){
      firebaseApp=firebase.initializeApp(config);
    }else{
      firebaseApp=firebase.app();
    }

    if(firebase.auth){
      try{
        firebase.auth().signInAnonymously().catch(err=>{
          console.warn('Anonymous auth note (optional):', err?.message||err);
        });
      }catch(e){}
    }

    // Check whether to use Firestore or Realtime Database
    const hasDatabaseUrl = !!(config.databaseURL && config.databaseURL.trim());
    if(!hasDatabaseUrl && firebase.firestore && (config.projectId || config.apiKey)){
      setupFirestore(config);
    }else if(firebase.database){
      setupRealtimeDb(config);
    }else if(firebase.firestore){
      setupFirestore(config);
    }
  }catch(err){
    console.error('Firebase init error:',err);
    isCloudActive=false;
    cloudSyncStatus='error';
    cloudSyncMessage='কানেকশন এরর: '+err.message;
    updateCloudStatusUI();
  }
}

function setupRealtimeDb(config){
  try{
    firebaseDb=firebase.database();
    activeCloudEngine='rtdb';
    isCloudActive=true;

    firebaseDb.ref('.info/connected').on('value',(snap)=>{
      if(snap.val()===true){
        cloudSyncStatus='connected';
        cloudSyncMessage='লাইভ ক্লাউড ডাটাবেজ (RTDB) সক্রিয়';
      }else{
        cloudSyncStatus='connecting';
        cloudSyncMessage='পুনরায় যুক্ত হচ্ছে...';
      }
      updateCloudStatusUI();
    });

    firebaseDb.ref('eventpass/guests').on('value',(snap)=>{
      const val=snap.val();
      let cloudList=[];
      if(!val || val._empty){
        cloudList=[];
      }else if(Array.isArray(val)){
        cloudList=val.filter(u=>u && !u._empty);
      }else if(typeof val==='object'){
        cloudList=Object.values(val).filter(u=>u && !u._empty);
      }
      users=cloudList.filter(u=>u && u.guestId && u.guestId!=='EP-B3002B18D7').map(u=>({...u,idCardPassword:u.idCardPassword||'1234',qrValue:buildQrValue(u),tShirtClaimed:!!u.tShirtClaimed,tShirtClaimedAt:u.tShirtClaimedAt||null,tShirtClaimedBy:u.tShirtClaimedBy||null})).sort((a,b)=>(a.serial||0)-(b.serial||0));
      localStorage.setItem(USERS_KEY,JSON.stringify(users));
      refreshLiveViews();
      if(tab==='guests' || tab==='dashboard') render();
      cloudSyncStatus='connected';
      cloudSyncMessage='লাইভ ক্লাউড ডাটাবেজ সক্রিয়';
      updateCloudStatusUI();
    },(err)=>{
      console.warn('RTDB error, trying Firestore...', err);
      if(firebase.firestore) setupFirestore(config);
    });

    firebaseDb.ref('eventpass/settings').on('value',(snap)=>{
      const val=snap.val();
      if(val && typeof val==='object' && !val._empty){
        if(val.eventName === 'হীরক জয়ন্তী ২০২৭' || (typeof val.eventName === 'string' && val.eventName.includes('হীরক জয়ন্তী'))){
          val.eventName = defaults.eventName;
          val.instituteName = defaults.instituteName;
          val.eventDate = defaults.eventDate;
          val.eventTime = defaults.eventTime;
          val.venue = defaults.venue;
          val.organizedBy = defaults.organizedBy;
          val.eventSlogan = defaults.eventSlogan;
          val.eventQuote = defaults.eventQuote;
          val.eventMotto = defaults.eventMotto;
          val.scannerName = defaults.scannerName;
          try{ firebaseDb.ref('eventpass/settings').update(val); }catch(e){}
        }
        settings={...defaults,...settings,...val};
        localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
      }
    });

    firebaseDb.ref('eventpass/volunteers').on('value',(snap)=>{
      const val=snap.val();
      let vList=[];
      if(!val || val._empty){
        vList=[];
      }else if(Array.isArray(val)){
        vList=val.filter(v=>v && !v._empty);
      }else if(typeof val==='object'){
        vList=Object.values(val).filter(v=>v && !v._empty);
      }
      volunteers=vList;
      localStorage.setItem(VOLUNTEERS_KEY,JSON.stringify(volunteers));
      if(tab==='volunteers') render();
    });
  }catch(e){
    console.warn('RTDB init exception, fallback to Firestore...', e);
    if(firebase.firestore) setupFirestore(config);
  }
}

function setupFirestore(config){
  try{
    firebaseFirestore=firebase.firestore();
    activeCloudEngine='firestore';
    isCloudActive=true;
    cloudSyncStatus='connecting';
    cloudSyncMessage='ক্লাউড ফায়ারস্টোরে যুক্ত হচ্ছে...';
    updateCloudStatusUI();

    firebaseFirestore.collection('guests').onSnapshot((snap)=>{
      let cloudList=[];
      snap.forEach(doc=>{
        const d=doc.data();
        if(d) cloudList.push(d);
      });
      if(cloudList.length>0){
        users=cloudList.map(u=>({...u,idCardPassword:u.idCardPassword||'1234',qrValue:buildQrValue(u),tShirtClaimed:!!u.tShirtClaimed,tShirtClaimedAt:u.tShirtClaimedAt||null,tShirtClaimedBy:u.tShirtClaimedBy||null})).sort((a,b)=>(a.serial||0)-(b.serial||0));
        localStorage.setItem(USERS_KEY,JSON.stringify(users));
        refreshLiveViews();
        if(tab==='guests' || tab==='dashboard') render();
      }else{
        users=[];
        localStorage.setItem(USERS_KEY,JSON.stringify(users));
        refreshLiveViews();
        if(tab==='guests' || tab==='dashboard') render();
      }
      cloudSyncStatus='connected';
      cloudSyncMessage='লাইভ ক্লাউড ফায়ারস্টোর (Firestore) সক্রিয়';
      updateCloudStatusUI();
    },(err)=>{
      console.error('Firestore sync error:',err);
      cloudSyncStatus='error';
      cloudSyncMessage='ফায়ারস্টোর এক্সেস ত্রুটি (Firestore Rules এ allow read, write: if true দিন)';
      updateCloudStatusUI();
    });
  }catch(err){
    console.error('Firestore setup error:',err);
    isCloudActive=false;
    cloudSyncStatus='error';
    cloudSyncMessage='ফায়ারস্টোর এরর: '+err.message;
    updateCloudStatusUI();
  }
}

function mergeGuestLists(localList,cloudList){
  const map=new Map();
  (localList||[]).forEach(u=>{if(u&&u.guestId)map.set(u.guestId,u)});
  (cloudList||[]).forEach(u=>{
    if(u&&u.guestId){
      const existing=map.get(u.guestId);
      map.set(u.guestId,{...existing,...u});
    }
  });
  return Array.from(map.values()).sort((a,b)=>(b.serial||0)-(a.serial||0));
}

function pushAllDataToCloud(){
  if(!isCloudActive){
    toast('Cloud database not connected','bad');
    return;
  }
  try{
    if(activeCloudEngine==='firestore' && firebaseFirestore){
      users.forEach(u=>{
        if(u && u.guestId){
          firebaseFirestore.collection('guests').doc(u.guestId).set(u,{merge:true});
        }
      });
      toast('সফলভাবে সমস্ত ডাটা ক্লাউড ফায়ারস্টোরে পুশ করা হয়েছে! 🚀','ok');
    }else if(activeCloudEngine==='rtdb' && firebaseDb){
      firebaseDb.ref('eventpass/guests').set(users.length === 0 ? {_empty:true} : users);
      firebaseDb.ref('eventpass/settings').set(settings);
      firebaseDb.ref('eventpass/volunteers').set(volunteers.length === 0 ? {_empty:true} : volunteers);
      toast('সফলভাবে সমস্ত ডাটা ক্লাউডে আপলোড করা হয়েছে! 🚀','ok');
    }
  }catch(e){
    toast('আপলোড ব্যর্থ: '+e.message,'bad');
  }
}

function updateCloudStatusUI(){
  const els=document.querySelectorAll('.cloudStatusContainer');
  const isConn=cloudSyncStatus==='connected';
  const isErr=cloudSyncStatus==='error';
  const isConnPending=cloudSyncStatus==='connecting';
  const cls=isConn?'connected':isErr?'error':isConnPending?'connecting':'offline';
  const dotCls=isConn?'green':isErr?'red':'yellow';
  const txt=isConn?'☁️ Cloud Live':isErr?'☁️ Cloud Error':isConnPending?'☁️ Connecting...':'☁️ Local (Sync Setup)';

  els.forEach(el=>{
    if(!isAdmin){
      el.innerHTML='';
      return;
    }
    el.innerHTML=`<span class="cloudStatusBadge ${cls}" onclick="openCloudModal()" title="${esc(cloudSyncMessage)}"><span class="statusDot ${dotCls}"></span> ${txt}</span>`;
  });

  const banner=document.getElementById('dashboardCloudBanner');
  if(banner && isAdmin){
    if(isConn){
      banner.className='cloudBanner ok';
      banner.innerHTML=`
        <div style="display:flex;align-items:center;gap:10px">
          <span class="statusDot green"></span>
          <span><b>লাইভ ক্লাউড ডাটাবেজ সক্রিয়:</b> সকল মোবাইল ও ল্যাপটপ ডিভাইসে স্বয়ংক্রিয় রিয়েল-টাইম সিঙ্ক হচ্ছে। (${users.length} জন গেস্ট সিঙ্কড)</span>
        </div>
        <button class="secondary" style="padding:6px 12px;font-size:11px" onclick="event.stopPropagation();openCloudModal()">⚙️ Settings</button>
      `;
    }else if(isErr){
      banner.className='cloudBanner bad';
      banner.innerHTML=`
        <div style="display:flex;align-items:center;gap:10px">
          <span class="statusDot red"></span>
          <span><b>ক্লাউড কানেকশন এরর:</b> ${esc(cloudSyncMessage)}</span>
        </div>
        <button class="primary" style="padding:6px 14px;font-size:11px" onclick="event.stopPropagation();openCloudModal()">⚡ সেটিংস ঠিক করুন</button>
      `;
    }
  }
}

const defaultFormFields = [

];

const sampleUsers=[];
const defaultVolunteers=[];

let isGateMode=!!currentVolunteer;

function getGuestCount(u){return Math.max(1,Number(u?.personCount)||(u?.guestType==='Couple'?2:u?.guestType==='Family'?3:1))}
function getGuestTShirtSize(u){
  if(!u) return '—';
  if(u.tShirtSize && String(u.tShirtSize).trim()) return String(u.tShirtSize).trim();
  if(u.customFields && typeof u.customFields === 'object'){
    const fields = (typeof getFormFields === 'function') ? getFormFields() : [];
    for(const f of fields){

function getTShirtStats(){
  const total = users.length;
  const claimed = users.filter(u => u.tShirtClaimed).length;
  const pending = total - claimed;
  const rate = total > 0 ? Math.round((claimed / total) * 100) : 0;

  const standardSizes = ['S', 'M', 'L', 'XL', 'XXL', '3XL'];
  const sizeMap = {};
  standardSizes.forEach(s => {
    sizeMap[s] = { total: 0, claimed: 0, pending: 0 };
  });

  users.forEach(u => {
    const s = (getGuestTShirtSize(u) || '').trim().toUpperCase();
    if(sizeMap[s]){
      sizeMap[s].total++;
      if(u.tShirtClaimed) sizeMap[s].claimed++;
      else sizeMap[s].pending++;
    } else if(s && s !== '—') {
      if(!sizeMap['Other']) sizeMap['Other'] = { total: 0, claimed: 0, pending: 0 };
      sizeMap['Other'].total++;
      if(u.tShirtClaimed) sizeMap['Other'].claimed++;
      else sizeMap['Other'].pending++;
    }
  });

  return { total, claimed, pending, rate, sizeMap };
}

let draggedFieldId = null;

function handleFieldDragStart(e, id){
  draggedFieldId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  const card = e.currentTarget;
  setTimeout(() => { if(card) card.classList.add('isDragging'); }, 0);
}

function handleFieldDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleFieldDragEnter(e, targetId){
  e.preventDefault();
  if(!draggedFieldId || draggedFieldId === targetId) return;
  const card = document.querySelector(`.fieldCard[data-field-id="${targetId}"]`);
  if(card) card.classList.add('dragOver');
}

function handleFieldDragLeave(e){
  const card = e.currentTarget;
  if(card) card.classList.remove('dragOver');
}

function handleFieldDrop(e, targetId){
  e.preventDefault();
  document.querySelectorAll('.fieldCard').forEach(c => c.classList.remove('dragOver', 'isDragging'));
  if(!draggedFieldId || draggedFieldId === targetId){
    draggedFieldId = null;
    return;
  }
  const fields = getFormFields();
  const fromIdx = fields.findIndex(x => x.id === draggedFieldId);
  const toIdx = fields.findIndex(x => x.id === targetId);
  if(fromIdx !== -1 && toIdx !== -1){
    const [item] = fields.splice(fromIdx, 1);
    fields.splice(toIdx, 0, item);
    settings.formFields = fields;
    save();
    toast(`"${item.label}" ফিল্ডের অবস্থান পরিবর্তন করা হয়েছে ✓`);
    if(tab === 'settings') render();
  }
  draggedFieldId = null;
}

function handleFieldDragEnd(e){
  document.querySelectorAll('.fieldCard').forEach(c => c.classList.remove('dragOver', 'isDragging'));
  draggedFieldId = null;
}

function moveFormField(id, delta){
  const fields = getFormFields();
  const idx = fields.findIndex(x => x.id === id);
  if(idx === -1) return;
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= fields.length) return;
  const [item] = fields.splice(idx, 1);
  fields.splice(newIdx, 0, item);
  settings.formFields = fields;
  save();
  toast(`"${item.label}" ${delta < 0 ? 'উপরে' : 'নিচে'} নেওয়া হয়েছে ✓`);
  if(tab === 'settings') render();
}

function save(skipCloud=false){
  localStorage.setItem(USERS_KEY,JSON.stringify(users));
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
  try{window.dispatchEvent(new Event('storage'))}catch(e){}
  if(!skipCloud && isCloudActive){
    if(activeCloudEngine==='firestore' && firebaseFirestore){
      try{
        if(users.length===0){
          firebaseFirestore.collection('guests').get().then(qs=>qs.forEach(d=>d.ref.delete()));
        }else{
          users.forEach(u=>{
            if(u && u.guestId){
              firebaseFirestore.collection('guests').doc(u.guestId).set(u,{merge:true});
            }
          });
        }
      }catch(e){console.warn('Firestore save warning:',e)}
    }else if(activeCloudEngine==='rtdb' && firebaseDb){
      try{
        if(users.length===0){
          firebaseDb.ref('eventpass/guests').set({_empty:true});
        }else{
          firebaseDb.ref('eventpass/guests').set(users);
        }
        firebaseDb.ref('eventpass/settings').set(settings);
      }catch(e){console.warn('Firebase save warning:',e)}
    }
  }
}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return 'EP-'+(crypto.randomUUID?.().replaceAll('-','').slice(0,10).toUpperCase()||Math.random().toString(36).slice(2,12).toUpperCase())}
function nextSerial(){return users.reduce((m,u)=>Math.max(m,Number(u.serial)||0),0)+1}
function getHeadcounts(){
  const totalProfiles=users.length;
  const totalPersons=users.reduce((s,u)=>s+getGuestCount(u),0);
  const totalSub=users.reduce((s,u)=>s+Math.max(0,getGuestCount(u)-1),0);
  const checkedUsers=users.filter(u=>u.checkedIn);
  const checkedProfiles=checkedUsers.length;
  const checkedPersons=checkedUsers.reduce((s,u)=>s+getGuestCount(u),0);
  const checkedSub=checkedUsers.reduce((s,u)=>s+Math.max(0,getGuestCount(u)-1),0);
  const pendingProfiles=totalProfiles-checkedProfiles;
  const pendingPersons=totalPersons-checkedPersons;
  const pendingSub=totalSub-checkedSub;
  const rate=totalProfiles?Math.round(checkedProfiles/totalProfiles*100):0;
  const mealRate=totalPersons?Math.round(checkedPersons/totalPersons*100):0;
  return {totalProfiles,totalPersons,totalSub,checkedProfiles,checkedPersons,checkedSub,pendingProfiles,pendingPersons,pendingSub,rate,mealRate};
}
function normalizePhone(v){return String(v||'').replace(/\D/g,'')}
let audioCtx=null;
function initAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function playTone(freq,duration=0.12,delay=0,type='sine',volume=0.07){const ctx=initAudio();if(!ctx)return;const now=ctx.currentTime+delay;const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+duration+0.02)}
function playScanSound(kind){if(kind==='valid'||kind==='success'){playTone(880,0.10,0,'sine',0.08);playTone(1320,0.14,0.11,'sine',0.08);return}if(kind==='invalid'||kind==='error'){playTone(260,0.16,0,'square',0.06);playTone(190,0.20,0.15,'square',0.055);return}if(kind==='duplicate'){playTone(420,0.13,0,'triangle',0.06);playTone(300,0.18,0.13,'triangle',0.055);return}playTone(740,0.10,0,'sine',0.06)}
window.addEventListener('pointerdown',initAudio,{once:true,passive:true});
window.addEventListener('keydown',initAudio,{once:true,passive:true});

async function verifyIDCardAccess(e,id){
  e.preventDefault();
  const input=document.getElementById('checkIdCardPassword');
  const val=(input?.value||'').trim();
  const u=users.find(x=>x.guestId===id);
  if(!u)return;
  const adminHash=await hashText(val);
  const expectedAdminHash=settings.adminPasswordHash||'5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
  if(val===(u.idCardPassword||'1234') || adminHash===expectedAdminHash){
    closeModal();
    openIDCard(id);
    toast('পাসওয়ার্ড সঠিক হয়েছে! ✓');
  }else{
    toast('ভুল পাসওয়ার্ড! অনুগ্রহ করে সঠিক পাসওয়ার্ড দিন।','bad');
    if(input){input.value='';input.focus()}
  }
}

function renderPublicLookup(){
  const area=document.getElementById('publicGuestListArea');
  if(!area)return render();
  const q=publicSearch.toLowerCase().trim();
  const filtered=users.filter(u=>{
    if(!q)return true;
    return [u.name,u.phone,u.email,u.guestId,u.sscBatch,u.code,String(u.serial)].some(x=>String(x||'').toLowerCase().includes(q));
  }).sort((a,b)=>b.serial-a.serial);
  const displayList=q?filtered:filtered.slice(0,6);
  area.innerHTML=renderPublicGuestGrid(displayList);
}

function submitVolunteerLogin(e){
  e.preventDefault();
  const vid=document.getElementById('volLoginSelect')?.value;
  const pass=(document.getElementById('volLoginPassword')?.value||'').trim();
  const v=volunteers.find(x=>x.id===vid);
  if(!v){toast('Volunteer not found','bad');return}
  if(pass!==v.password && pass!=='12345'){
    toast('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন (ডিফল্ট: 1234)','bad');
    return;
  }
  currentVolunteer=v;
  isGateMode=true;
  activeVolunteerTab=pendingVolunteerTarget||'gate';
  sessionStorage.setItem('eventpass_volunteer_tab',activeVolunteerTab);
  sessionStorage.setItem('eventpass_volunteer_session',JSON.stringify(v));
  closeModal();
  render();
  toast(`Welcome, ${v.name}! ${activeVolunteerTab==='tshirt'?'T-Shirt':'Gate'} Scanner is live. ✓`);
}

function gateResultHTML(){
  if(!gateScanResult){
    return `
      <div class="gateWaitBox">
        <div class="gateWaitIcon">📷</div>
        <h3 style="font-size:17px;color:#fff;margin:0 0 6px">${gateScannerMode==='valid'?'Ready to Validate Guest':'Ready for Guest Check-in'}</h3>
        <p style="font-size:12.5px;color:#7e8ea6;margin:0">${gateScannerMode==='valid'?'অতিথির কিউআর কোড স্ক্যান করে ভ্যালিড কিনা যাচাই করুন।':'অতিথির কিউআর কোড স্ক্যান করুন। তাৎক্ষণিক নাম, গেস্ট নং, ধরন ও টি-শার্ট সাইজ দেখতে পাবেন।'}</p>
      </div>
    `;
  }

  const res=gateScanResult;
  if(res.mode==='valid'){
    if(!res.ok){
      return `
        <div class="gateResultCard bad">
          <div style="font-size:32px;margin-bottom:6px">❌</div>
          <span style="background:#b91c1c;color:#fff;font-size:10.5px;font-weight:900;letter-spacing:1px;padding:3px 10px;border-radius:6px;text-transform:uppercase">INVALID USER / নিবন্ধিত নয়</span>
          <h3 style="font-size:18px;margin:8px 0 4px;color:#fff">${esc(res.message||'QR Code Not Found')}</h3>
          <p style="font-size:12px;color:#fca5a5;margin:0">${esc(res.detail||'এই কিউআর কোডটি কোনো নিবন্ধিত অতিথির নয়।')}</p>
          <button type="button" class="secondary" style="margin-top:12px;font-size:11px;padding:6px 14px" onclick="gateScanResult=null;updateGateResult()">Dismiss</button>
        </div>
      `;
    }
    const u=res.user;
    return `
      <div class="gateResultCard ok" style="border-color:#10b981;background:linear-gradient(180deg,#064e3b,#022c22);padding:16px">
        <div style="font-size:30px;margin-bottom:6px">✓</div>
        <span style="background:#059669;color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:4px 14px;border-radius:999px;text-transform:uppercase">✓ VALID USER (নিবন্ধিত অতিথি)</span>
        ${renderScanGuestDetails(u)}
        <div style="background:#064e3b;border:1px dashed #34d399;color:#a7f3d0;border-radius:8px;padding:8px;font-size:11px;margin-top:10px">
          ℹ️ ভ্যালিড ইউজার মোড: এটি শুধুমাত্র অতিথি যাচাইয়ের জন্য, কোনো চেক-ইন করা হয়নি।
        </div>
        <button type="button" class="secondary" style="margin-top:12px;font-size:11.5px;padding:7px 16px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:8px;cursor:pointer" onclick="gateScanResult=null;updateGateResult()">পরবর্তী স্ক্যান / Next Scan ➔</button>
      </div>
    `;
  }

  if(!res.ok){
    if(res.duplicate && res.user){
      const u=res.user;
      return `

    toast('Invalid User / অনিবন্ধিত কিউআর','bad');

  }
  gateScanResult={ok:true,mode:'valid',user:u};

function gateCheckIn(raw){
  const u=resolveGuest(raw);
  if(!u){
    gateScanResult={ok:false,message:'QR / Code not found',duplicate:false};
    updateGateResult();
    if(gateSoundEnabled)playScanSound('invalid');
    toast('QR not recognized / নিবন্ধিত নয়','bad');

  }
  const count=getGuestCount(u);
  const sub=Math.max(0,count-1);
  const countDesc=sub>0?`সাব এ ${sub} জন, মোট ${count} জন`:`মোট ১ জন`;

  if(u.checkedIn){
    gateScanResult={ok:false,message:'Already Attended',duplicate:true,user:u};
    updateGateResult();
    if(gateSoundEnabled)playScanSound('duplicate');
    toast(`${u.name} — Already Attended (${u.scanner||'Gate'})`,'bad');
    return false;
  }

  gateScanResult={ok:true,user:u,confirmed:false};
  updateGateResult();

function gateProcessScan(decoded){

let currentCameraIndex = -1;
let availableCameras = [];
let gateFacingMode = 'environment';

function findBackCameraIndex(cams){
  if(!cams || !cams.length) return 0;
  const backIdx = cams.findIndex(c => {
    const l = (c.label || '').toLowerCase();
    return l.includes('back') || l.includes('rear') || l.includes('environment') || l.includes('wide') || l.includes('facing back');
  });
  if(backIdx !== -1) return backIdx;

  const nonFrontIdx = cams.findIndex(c => {
    const l = (c.label || '').toLowerCase();
    return !l.includes('front') && !l.includes('selfie') && !l.includes('user') && !l.includes('facing front');
  });
  if(nonFrontIdx !== -1) return nonFrontIdx;

  return 0;
}

async function startGateScanner(){
  if(!window.Html5Qrcode)return;
  const el=document.getElementById('gateReader');
  if(!el)return;
  stopGateScanner();
  try{
    gateScanner=new Html5Qrcode('gateReader');
    const onScanSuccess=(decoded)=>{
      if(decoded&&decoded!==gateLastScan){
        gateLastScan=decoded;
        gateProcessScan(decoded);
        setTimeout(()=>gateLastScan='',2200);
      }
    };
    const scanConfig = {
      fps: 15,
      qrbox: (w, h) => {
        const edge = Math.max(180, Math.floor(Math.min(w, h) * 0.72));
        return { width: edge, height: edge };
      }
    };

    if(!availableCameras.length){
      try{ availableCameras = await Html5Qrcode.getCameras(); }catch(e){ availableCameras = []; }
    }

    const hasLabels = availableCameras.some(c => !!(c.label && c.label.trim()));
    if(availableCameras.length > 0 && hasLabels){
      if(currentCameraIndex < 0 || currentCameraIndex >= availableCameras.length){
        currentCameraIndex = findBackCameraIndex(availableCameras);
      }
      const cam = availableCameras[currentCameraIndex];
      await gateScanner.start(cam.id, scanConfig, onScanSuccess, ()=>{});
    }else{
      await gateScanner.start({ facingMode: gateFacingMode || "environment" }, scanConfig, onScanSuccess, ()=>{});
      try{
        const refreshed = await Html5Qrcode.getCameras();
        if(refreshed && refreshed.length){
          availableCameras = refreshed;
          if(currentCameraIndex < 0) currentCameraIndex = findBackCameraIndex(availableCameras);
        }
      }catch(e){}
    }
  }catch(err){
    console.warn('Gate primary camera start failed, fallback to environment facingMode...', err);
    try{
      const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };
      const fallbackMode = gateFacingMode === 'user' ? 'user' : 'environment';
      await gateScanner.start({ facingMode: fallbackMode }, scanConfig, (decoded)=>{
        if(decoded&&decoded!==gateLastScan){
          gateLastScan=decoded;
          gateProcessScan(decoded);
          setTimeout(()=>gateLastScan='',2200);
        }
      }, ()=>{});
    }catch(err2){
      console.warn('Fallback failed, attempting user facingMode...', err2);
      try{
        const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };
        await gateScanner.start({ facingMode: "user" }, scanConfig, (decoded)=>{
          if(decoded&&decoded!==gateLastScan){
            gateLastScan=decoded;
            gateProcessScan(decoded);
            setTimeout(()=>gateLastScan='',2200);
          }
        }, ()=>{});
      }catch(err3){
        console.error('All camera attempts failed:', err3);
      }
    }
  }
}

async function switchGateCamera(){
  if(!window.Html5Qrcode)return;
  try{
    if(!availableCameras.length){
      try{ availableCameras = await Html5Qrcode.getCameras(); }catch(e){ availableCameras = []; }
    }

    if(availableCameras && availableCameras.length > 1){
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      const cam = availableCameras[currentCameraIndex];
      const lbl = (cam.label || '').toLowerCase();
      const isFront = lbl.includes('front') || lbl.includes('selfie') || lbl.includes('user') || lbl.includes('facing front');
      const isBack = lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment') || lbl.includes('wide') || lbl.includes('facing back');
      let camDesc = cam.label || ('Camera ' + (currentCameraIndex + 1));
      if(isFront) camDesc = `🤳 সামনের ক্যামেরা (${camDesc})`;
      else if(isBack) camDesc = `📷 পেছনের ক্যামেরা (${camDesc})`;
      else camDesc = `📷 ক্যামেরা: ${camDesc}`;
      toast(camDesc);
      startGateScanner();
    }else{
      gateFacingMode = (gateFacingMode === 'environment' ? 'user' : 'environment');
      const modeText = gateFacingMode === 'environment' ? '📷 পেছনের ক্যামেরা চালু হচ্ছে (Back Camera)...' : '🤳 সামনের ক্যামেরা চালু হচ্ছে (Selfie Camera)...';
      toast(modeText);
      stopGateScanner();
      setTimeout(async ()=>{
        try{
          gateScanner = new Html5Qrcode('gateReader');
          const scanConfig = {
            fps: 15,
            qrbox: (w, h) => {
              const edge = Math.max(180, Math.floor(Math.min(w, h) * 0.72));
              return { width: edge, height: edge };
            }
          };
          await gateScanner.start({ facingMode: gateFacingMode }, scanConfig, (decoded)=>{
            if(decoded && decoded !== gateLastScan){
              gateLastScan = decoded;
              gateProcessScan(decoded);
              setTimeout(()=>gateLastScan='', 2200);
            }
          }, ()=>{});
        }catch(e){
          toast('ক্যামেরা পরিবর্তন করা যায়নি','bad');
        }
      }, 100);
    }
  }catch(e){
    toast('ক্যামেরা পরিবর্তন করা যায়নি: ' + (e.message || ''),'bad');
  }
}

async function scanGateImage(input){
  const file = input?.files?.[0];
  if(!file) return;
  toast('ছবি থেকে কিউআর রিড করা হচ্ছে...','info');
  try{
    const tempScanner = new Html5Qrcode('gateReader');
    const decoded = await tempScanner.scanFile(file, true);
    if(decoded){
      gateProcessScan(decoded);
    }else{
      toast('ছবিতে কোনো কিউআর কোড পাওয়া যায়নি','bad');
    }
  }catch(err){
    try{
      if(gateScanner){
        const decoded = await gateScanner.scanFile(file, true);
        if(decoded) gateProcessScan(decoded);
        else toast('ছবিতে কিউআর পাওয়া যায়নি','bad');
      }else{
        toast('কিউআর রিড করা যায়নি: ' + (err.message || 'Invalid image'),'bad');
      }
    }catch(e2){
      toast('কিউআর রিড করা যায়নি: ' + (e2.message || 'Invalid image'),'bad');
    }
  }
  input.value = '';
}

async function startTShirtScanner(){
  if(!window.Html5Qrcode) return;
  const el=document.getElementById('tshirtReader');
  if(!el) return;
  stopTShirtScanner();
  try{
    tshirtScanner=new Html5Qrcode('tshirtReader');
    const onScanSuccess=(decoded)=>{
      if(decoded&&decoded!==tshirtLastScan){
        tshirtLastScan=decoded;
        tshirtProcessScan(decoded);
        setTimeout(()=>tshirtLastScan='',2200);
      }
    };
    const scanConfig={
      fps:15,
      qrbox:(w,h)=>{
        const edge=Math.max(180,Math.floor(Math.min(w,h)*0.72));
        return {width:edge,height:edge};
      }
    };

    if(!availableCameras.length){
      try{ availableCameras=await Html5Qrcode.getCameras(); }catch(e){ availableCameras=[]; }
    }

    const hasLabels=availableCameras.some(c=>!!(c.label&&c.label.trim()));
    if(availableCameras.length>0&&hasLabels){
      if(currentCameraIndex<0||currentCameraIndex>=availableCameras.length){
        currentCameraIndex=findBackCameraIndex(availableCameras);
      }
      const cam=availableCameras[currentCameraIndex];
      await tshirtScanner.start(cam.id,scanConfig,onScanSuccess,()=>{});
    }else{
      await tshirtScanner.start({facingMode:tshirtFacingMode||"environment"},scanConfig,onScanSuccess,()=>{});
      try{
        const refreshed=await Html5Qrcode.getCameras();
        if(refreshed&&refreshed.length){
          availableCameras=refreshed;
          if(currentCameraIndex<0) currentCameraIndex=findBackCameraIndex(availableCameras);
        }
      }catch(e){}
    }
  }catch(err){
    console.warn('T-Shirt primary camera start failed, fallback to environment facingMode...',err);
    try{
      const scanConfig={fps:15,qrbox:{width:220,height:220}};
      await tshirtScanner.start({facingMode:"environment"},scanConfig,(decoded)=>{
        if(decoded&&decoded!==tshirtLastScan){
          tshirtLastScan=decoded;
          tshirtProcessScan(decoded);
          setTimeout(()=>tshirtLastScan='',2200);
        }
      },()=>{});
    }catch(err2){
      try{
        const scanConfig={fps:15,qrbox:{width:220,height:220}};
        await tshirtScanner.start({facingMode:"user"},scanConfig,(decoded)=>{
          if(decoded&&decoded!==tshirtLastScan){
            tshirtLastScan=decoded;
            tshirtProcessScan(decoded);
            setTimeout(()=>tshirtLastScan='',2200);
          }
        },()=>{});
      }catch(err3){
        console.error('All T-Shirt camera attempts failed:',err3);
      }
    }
  }
}

async function switchTShirtCamera(){
  if(!window.Html5Qrcode) return;
  try{
    if(!availableCameras.length){
      try{ availableCameras=await Html5Qrcode.getCameras(); }catch(e){ availableCameras=[]; }
    }

    if(availableCameras&&availableCameras.length>1){
      currentCameraIndex=(currentCameraIndex+1)%availableCameras.length;
      const cam=availableCameras[currentCameraIndex];
      const lbl=(cam.label||'').toLowerCase();
      const isFront=lbl.includes('front')||lbl.includes('selfie')||lbl.includes('user');
      const isBack=lbl.includes('back')||lbl.includes('rear')||lbl.includes('environment');
      let camDesc=cam.label||('Camera '+(currentCameraIndex+1));
      if(isFront) camDesc=`🤳 সামনের ক্যামেরা (${camDesc})`;
      else if(isBack) camDesc=`📷 পেছনের ক্যামেরা (${camDesc})`;
      toast(camDesc);
      startTShirtScanner();
    }else{
      tshirtFacingMode=(tshirtFacingMode==='environment'?'user':'environment');
      toast(tshirtFacingMode==='environment'?'📷 পেছনের ক্যামেরা চালু হচ্ছে...':'🤳 সামনের ক্যামেরা চালু হচ্ছে...');
      stopTShirtScanner();
      setTimeout(startTShirtScanner,120);
    }
  }catch(e){
    toast('ক্যামেরা পরিবর্তন করা যায়নি: '+(e.message||''),'bad');
  }
}

async function scanTShirtImage(input){
  const file=input?.files?.[0];
  if(!file) return;
  toast('ছবি থেকে কিউআর রিড করা হচ্ছে...','info');
  try{
    const tempScanner=new Html5Qrcode('tshirtReader');
    const decoded=await tempScanner.scanFile(file,true);
    if(decoded){
      tshirtProcessScan(decoded);
    }else{
      toast('ছবিতে কোনো কিউআর কোড পাওয়া যায়নি','bad');
    }
  }catch(err){
    try{
      if(tshirtScanner){
        const decoded=await tshirtScanner.scanFile(file,true);
        if(decoded) tshirtProcessScan(decoded);
        else toast('ছবিতে কিউআর পাওয়া যায়নি','bad');
      }else{
        toast('কিউআর রিড করা যায়নি: '+(err.message||'Invalid image'),'bad');
      }
    }catch(e2){
      toast('কিউআর রিড করা যায়নি: '+(e2.message||'Invalid image'),'bad');
    }
  }
  input.value='';
}

async function submitVolunteer(e, id){
  e.preventDefault();
  const f=new FormData(e.target);
  const name=f.get('name').trim();
  const gate=f.get('gate').trim();
  const email=f.get('email').trim();
  const phone=f.get('phone').trim();
  const password=f.get('password').trim();
  const file=f.get('volPhoto');
  let photo='';
  if(file && file.size){
    photo = await resizeImage(file);
  }

  if(id){
    const v=volunteers.find(x=>x.id===id);
    if(!v)return;
    v.name=name;
    v.gate=gate;
    v.email=email;
    v.phone=phone;
    v.password=password;
    if(photo) v.photo=photo;
    saveVolunteers();
    closeModal();
    toast('Volunteer details updated ✓');
    render();
  }else{
    const newId='VOL-'+String(volunteers.length+1).padStart(2,'0');
    volunteers.push({
      id:newId,
      name,
      gate,
      email,
      phone,
      password,
      photo:photo||'',
      active:true,
      createdAt:new Date().toISOString()
    });
    saveVolunteers();
    closeModal();
    toast(`Volunteer ${name} added successfully ✓`);
    render();
  }
}

function deleteVolunteer(id){
  const v=volunteers.find(x=>x.id===id);
  if(!v)return;
  if(confirm(`Are you sure you want to delete volunteer "${v.name}"?`)){
    volunteers=volunteers.filter(x=>x.id!==id);
    saveVolunteers();
    toast(`Volunteer ${v.name} deleted`);
    render();
  }
}

function clearAllVolunteers(){
  if(!isAdmin){toast('Admin access required','bad');return}
  if(!volunteers.length){toast('No volunteers to delete');return}
  if(confirm(`Are you sure you want to permanently delete ALL (${volunteers.length}) volunteers?`)){
    volunteers=[];
    saveVolunteers();
    toast('All volunteers deleted');
    render();
  }
}

let adminCameraIndex = -1;
let adminAvailableCameras = [];
let adminFacingMode = 'environment';

async function startScanner(){
  if(!window.Html5Qrcode)return;
  const el=document.getElementById('reader');
  if(!el)return;
  stopScanner();
  try{
    scanner=new Html5Qrcode('reader');
    const scanConfig = {
      fps: 15,
      qrbox: (w, h) => {
        const edge = Math.max(180, Math.floor(Math.min(w, h) * 0.72));
        return { width: edge, height: edge };
      }
    };
    const onScan = decoded => {
      if(decoded && decoded !== lastScan){
        lastScan = decoded;
        if(scannerMode==='valid') validateUser(decoded);
        else checkIn(decoded);
        setTimeout(()=>lastScan='', 1800);
      }
    };

    if(!adminAvailableCameras.length){
      try{ adminAvailableCameras = await Html5Qrcode.getCameras(); }catch(e){ adminAvailableCameras = []; }
    }

    const hasLabels = adminAvailableCameras.some(c => !!(c.label && c.label.trim()));
    if(adminAvailableCameras.length > 0 && hasLabels){
      if(adminCameraIndex < 0 || adminCameraIndex >= adminAvailableCameras.length){
        adminCameraIndex = findBackCameraIndex(adminAvailableCameras);
      }
      const cam = adminAvailableCameras[adminCameraIndex];
      await scanner.start(cam.id, scanConfig, onScan, ()=>{});
    }else{
      await scanner.start({ facingMode: adminFacingMode || "environment" }, scanConfig, onScan, ()=>{});
      try{
        const refreshed = await Html5Qrcode.getCameras();
        if(refreshed && refreshed.length){
          adminAvailableCameras = refreshed;
          if(adminCameraIndex < 0) adminCameraIndex = findBackCameraIndex(adminAvailableCameras);
        }
      }catch(e){}
    }
  }catch(err){
    console.warn('Admin primary camera start failed, fallback...', err);
    try{
      const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };
      const fallbackMode = adminFacingMode === 'user' ? 'user' : 'environment';
      await scanner.start({ facingMode: fallbackMode }, scanConfig, onScan, ()=>{});
    }catch(err2){
      try{
        const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };
        await scanner.start({ facingMode: "user" }, scanConfig, onScan, ()=>{});
      }catch(err3){
        console.error('All admin camera attempts failed:', err3);
      }
    }
  }
}

async function switchAdminCamera(){
  if(!window.Html5Qrcode)return;
  try{
    if(!adminAvailableCameras.length){
      try{ adminAvailableCameras = await Html5Qrcode.getCameras(); }catch(e){ adminAvailableCameras = []; }
    }

    if(adminAvailableCameras && adminAvailableCameras.length > 1){
      adminCameraIndex = (adminCameraIndex + 1) % adminAvailableCameras.length;
      const cam = adminAvailableCameras[adminCameraIndex];
      const lbl = (cam.label || '').toLowerCase();
      const isFront = lbl.includes('front') || lbl.includes('selfie') || lbl.includes('user') || lbl.includes('facing front');
      const isBack = lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment') || lbl.includes('wide') || lbl.includes('facing back');
      let camDesc = cam.label || ('Camera ' + (adminCameraIndex + 1));
      if(isFront) camDesc = `🤳 সামনের ক্যামেরা (${camDesc})`;
      else if(isBack) camDesc = `📷 পেছনের ক্যামেরা (${camDesc})`;
      else camDesc = `📷 ক্যামেরা: ${camDesc}`;
      toast(camDesc);
      startScanner();
    }else{
      adminFacingMode = (adminFacingMode === 'environment' ? 'user' : 'environment');
      const modeText = adminFacingMode === 'environment' ? '📷 পেছনের ক্যামেরা চালু হচ্ছে (Back Camera)...' : '🤳 সামনের ক্যামেরা চালু হচ্ছে (Selfie Camera)...';
      toast(modeText);
      stopScanner();
      setTimeout(async ()=>{
        try{
          scanner = new Html5Qrcode('reader');
          const scanConfig = {
            fps: 15,
            qrbox: (w, h) => {
              const edge = Math.max(180, Math.floor(Math.min(w, h) * 0.72));
              return { width: edge, height: edge };
            }
          };
          const onScan = decoded => {
            if(decoded && decoded !== lastScan){
              lastScan = decoded;
              if(scannerMode==='valid') validateUser(decoded);
              else checkIn(decoded);
              setTimeout(()=>lastScan='', 1800);
            }
          };
          await scanner.start({ facingMode: adminFacingMode }, scanConfig, onScan, ()=>{});
        }catch(e){
          toast('ক্যামেরা পরিবর্তন করা যায়নি','bad');
        }
      }, 100);
    }
  }catch(e){
    toast('ক্যামেরা পরিবর্তন করা যায়নি: ' + (e.message || ''),'bad');
  }
}

function resolveGuest(raw){
  if(!raw)return null;
  reloadUsersFromStorage();
  const clean=String(raw).trim();
  const lower=clean.toLowerCase();

  // 1. Direct match with qrValue
  let found=users.find(u=>u.qrValue && u.qrValue.trim().toLowerCase()===lower);
  if(found)return found;

  // 2. Parse EVENTPASS format
  if(clean.toUpperCase().startsWith('EVENTPASS|')){
    const parts = clean.split('|');
    const epPart = parts.find(p => p.trim().toUpperCase().startsWith('EP-'));
    let guestId = epPart ? epPart.trim() : (parts[1] && parts[1].trim().toUpperCase().startsWith('EP-') ? parts[1].trim() : (parts[5] && parts[5].trim().toUpperCase().startsWith('EP-') ? parts[5].trim() : ''));

    // Match by guestId in existing database
    if(guestId){
      found = users.find(u=>u.guestId && u.guestId.trim().toLowerCase()===guestId.toLowerCase());
      if(found) return found;
    }
    // Match by code in existing database
    for(const p of parts){
      const trimmed = p.trim().toLowerCase();
      if(!trimmed) continue;
      found = users.find(u=>u.code && u.code.trim().toLowerCase()===trimmed);
      if(found) return found;
    }

    // IF NOT IN LOCAL DATABASE, BUT HAS SELF-CONTAINED GUEST DATA:
    // (This happens when guest was registered on a Laptop, and scanned on a Mobile Phone!)
    if(parts.length >= 3){
      let name = 'Registered Guest';
      let sscBatch = '';
      let personCount = 1;
      let tShirtSize = '';
      let code = '';
      let guestType = 'Individual';
      let entryType = 'Guest';

      if(parts[1] && parts[1].trim().toUpperCase().startsWith('EP-')){
        // Legacy format: EVENTPASS|EP-...|Name|Batch|Count|Code|GuestType
        guestId = parts[1].trim();
        try{ name = decodeURIComponent(parts[2] || 'Registered Guest'); }catch(e){ name = parts[2] || 'Registered Guest'; }
        try{ sscBatch = decodeURIComponent(parts[3] || ''); }catch(e){ sscBatch = parts[3] || ''; }
        personCount = Math.max(1, parseInt(parts[4] || '1', 10) || 1);
        code = (parts[5] || `EVT-${guestId.slice(-4)}`).trim();
        try{ guestType = decodeURIComponent(parts[6] || 'Individual'); }catch(e){ guestType = parts[6] || 'Individual'; }
      } else {
        // New format: EVENTPASS|Name|Batch ...|Guest ...|T-Shirt: ...|EP-...|Code|GuestType|EntryType
        name = (parts[1] || 'Registered Guest').trim();
        const bRaw = (parts[2] || '').trim();
        sscBatch = bRaw.replace(/^Batch\s*:?\s*/i, '').trim();
        if(sscBatch === '—') sscBatch = '';

        const cntRaw = (parts[3] || '').trim();
        const numMatch = cntRaw.match(/\d+/);
        personCount = numMatch ? Math.max(1, parseInt(numMatch[0], 10)) : 1;

        const tshRaw = (parts[4] || '').trim();
        tShirtSize = tshRaw.replace(/^T-Shirt\s*:?\s*/i, '').trim();
        if(tShirtSize === '—') tShirtSize = '';

        guestId = guestId || (parts[5] ? parts[5].trim() : `EP-${Date.now()}`);
        code = (parts[6] || `EVT-${guestId.slice(-4)}`).trim();
        guestType = (parts[7] || 'Individual').trim();
        entryType = (parts[8] || 'General').trim();
      }

      // Check one more time if guestId already exists
      if(guestId){
        found = users.find(u=>u.guestId && u.guestId.trim().toLowerCase()===guestId.toLowerCase());
        if(found) return found;
      }

      // Auto-register this guest into this device's storage so it is recognized!
      const autoImported = {
        serial: nextSerial(),
        guestId: guestId,
        name: name,
        phone: '',
        email: '',
        sscBatch: sscBatch,
        tShirtSize: tShirtSize,
        idCardPassword: '1234',
        personCount: personCount,
        profilePhoto: '',
        entryType: entryType,
        guestType: guestType,
        code: code,
        qrValue: clean,
        checkedIn: false,
        checkedAt: null,
        scanner: null,
        createdAt: new Date().toISOString()
      };
      users.push(autoImported);
      save();
      toast(`গেস্ট ডাটা লোড হয়েছে: ${name} (${personCount} জন) ✓`,'info');
      return autoImported;
    }
  }

  // 3. Fallback matching across all fields: guestId, code, serial, phone
  found=users.find(u=>
    (u.guestId && u.guestId.trim().toLowerCase()===lower) ||
    (u.code && u.code.trim().toLowerCase()===lower) ||
    String(u.serial)===clean ||
    (u.phone && u.phone.replace(/[^0-9]/g,'')===clean.replace(/[^0-9]/g,''))
  );
  return found || null;
}
function checkIn(raw){
  const u=resolveGuest(raw);

  const sub=Math.max(0,count-1);
  const countDesc=sub>0?`সাব এ ${sub} জন, মোট ${count} জন`:`মোট ১ জন`;
  if(u.checkedIn){scanResult={ok:false,message:'Already Attended',detail:`Guest #${u.serial} · ${u.name} has already attended (${countDesc}). First verified at ${formatBDDateTime(u.checkedAt)} by ${u.scanner||'Unknown scanner'}.`,user:u,duplicate:true};updateResult();playScanSound('duplicate');toast(`${u.name} — Already Attended / QR already used`,'bad');return false}

}

function resizeImage(file,size=400){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        c.width=size;
        c.height=size;
        const ctx=c.getContext('2d');
        const minDim=Math.min(img.width,img.height);
        const sx=(img.width-minDim)/2;
        const sy=img.height>img.width?Math.max(0,(img.height-minDim)*0.18):(img.height-minDim)/2;
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,size,size);
        ctx.drawImage(img,sx,sy,minDim,minDim,0,0,size,size);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

          const c=document.createElement('canvas');
          c.width=size;
          c.height=size;
          const ctx=c.getContext('2d');
          const minDim=Math.min(img.width,img.height);
          const sx=(img.width-minDim)/2;
          const sy=img.height>img.width?Math.max(0,(img.height-minDim)*0.18):(img.height-minDim)/2;
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,size,size);
          ctx.drawImage(img,sx,sy,minDim,minDim,0,0,size,size);

}

    if(!frontEl||!backEl)throw new Error('Card elements missing');

    const [frontCanvas,backCanvas]=await Promise.all([
      html2canvas(frontEl,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false}),
      html2canvas(backEl,{scale:3,useCORS:true,backgroundColor:'#ffffff',logging:false})
    ]);

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[85,122.5]});
    pdf.addImage(frontCanvas.toDataURL('image/jpeg',0.98),'JPEG',0,0,85,122.5);

    toast('PDF downloaded successfully! ✓');
  }catch(err){
    console.error('PDF error:',err);
    toast('PDF generation failed: '+(err.message||'Please try again'),'bad');
  }
}

async function downloadIDCardImage(id,side){

function saveCloudConfigFromModal(){
  const raw = document.getElementById('firebaseConfigInput')?.value?.trim();
  if(!raw){
    toast('Please paste your Firebase configuration','bad');
    return;
  }
  let parsed = null;
  if(raw.startsWith('https://') && raw.includes('firebaseio.com')){
    parsed = { databaseURL: raw.trim().replace(/\/+$/,'') };
  }else{
    try{
      parsed = JSON.parse(raw);
    }catch(e){
      try{
        const extractKey = (k) => {
          const m = raw.match(new RegExp(`${k}\\s*:\\s*["'\`]([^"'\`]+)["'\`]`));
          return m ? m[1] : '';
        };
        parsed = {
          apiKey: extractKey('apiKey'),
          authDomain: extractKey('authDomain'),
          databaseURL: extractKey('databaseURL'),
          projectId: extractKey('projectId'),
          storageBucket: extractKey('storageBucket'),
          messagingSenderId: extractKey('messagingSenderId'),
          appId: extractKey('appId')
        };
        if(!parsed.databaseURL && parsed.projectId){
          parsed.databaseURL = `https://${parsed.projectId}-default-rtdb.firebaseio.com`;
        }
      }catch(err){
        parsed = null;
      }
    }
  }

  if(!parsed || (!parsed.databaseURL && !parsed.apiKey)){
    toast('Invalid Firebase config. Could not find apiKey or databaseURL.','bad');
    return;
  }

  localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(parsed));
  toast('Firebase config saved! Connecting...','info');
  initFirebase(parsed);
  closeModal();
}

function clearCloudConfig(){
  if(confirm('Are you sure you want to disconnect from Cloud Sync? Local storage will be kept.')){
    localStorage.removeItem(FIREBASE_CONFIG_KEY);

    updateCloudStatusUI();
    closeModal();
  }
}
