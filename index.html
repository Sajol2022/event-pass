                  <label class="formSwitch" title="${isEnabled ? 'ফিল্ডটি বন্ধ করতে ক্লিক করুন' : 'ফিল্ডটি চালু করতে ক্লিক করুন'}">
                    <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleFieldEnabled('${f.id}', this.checked)">
                    <span class="formSlider"></span>
                  </label>
                </div>
              </div>

              <div>
                <label style="display:block;font-size:10px;color:#8996ad;margin-bottom:4px;font-weight:700">ফিল্ডের নাম / লেবেল (Label Name):</label>
                <input class="fieldLabelInput" value="${esc(f.label)}" onchange="updateFieldLabel('${f.id}', this.value)" placeholder="লেবেলের নাম">
              </div>

              <div class="idCardLocationTag">
                <span>📍 অবস্থান:</span>
                <b>${meta.desc}</b>
              </div>

              ${f.type === 'select' ? `
                <div style="margin-top:2px">
                  <label style="display:block;font-size:10px;color:#8996ad;margin-bottom:4px;font-weight:700">ড্রপডাউন অপশনসমূহ (কমা দিয়ে আলাদা করুন):</label>
                  <input class="fieldOptionsInput" value="${esc((f.options || []).join(', '))}" onchange="updateFieldOptions('${f.id}', this.value)" placeholder="যেমন: General, VIP, Guest অথবা S, M, L, XL">
                </div>
              ` : ''}

              <div class="fieldCardBottom">
                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                  <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
                    <input type="checkbox" ${f.required ? 'checked' : ''} onchange="updateFieldRequired('${f.id}', this.checked)" style="accent-color:#6366f1">
                    <span>বাধ্যতামূলক (Required)</span>
                  </label>
                  <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:${isTopBadge ? '#facc15' : '#94a3b8'};font-size:11px;font-weight:700" title="আইডি কার্ড ফ্রন্ট পেজের টপে VIP ব্যাজের পাশে দেখাবে">
                    <input type="checkbox" ${isTopBadge ? 'checked' : ''} onchange="setFieldAsTopBadge('${f.id}', this.checked)" style="accent-color:#eab308">
                    <span>📌 টপ ব্যাজ (VIP-এর পাশে)</span>
                  </label>
                  ${isCustom ? `
                    <label class="idCardCustomToggle">
                      <input type="checkbox" ${f.showOnIdCard ? 'checked' : ''} onchange="toggleFieldShowOnIdCard('${f.id}', this.checked)" style="accent-color:#3b82f6">
                      <span>🪪 আইডি কার্ডের পেছনে দেখাবে</span>
                    </label>
                  ` : ''}
                </div>
                ${isCustom ? `
                  <button type="button" class="fieldDeleteBtn" onclick="deleteCustomField('${f.id}')" title="ফিল্ডটি মুছে ফেলুন">🗑️ মুছে ফেলুন (Delete)</button>
                ` : `
                  <small style="color:#64748b;font-size:10px">সিস্টেম ফিল্ড</small>
                `}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap">
        <button type="button" class="secondary" style="font-size:11px" onclick="resetFormFieldsToDefault()">🔄 ডিফল্ট ফিল্ডে রিসেট</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="secondary" style="font-size:11px;color:#a5b4fc" onclick="openAdd()">👁️ ফর্ম প্রিভিউ</button>
          <button type="button" class="primary" style="font-size:11px" onclick="openAddCustomFieldModal()">＋ নতুন ফিল্ড যোগ</button>
        </div>
      </div>
    </div>
  `;

  return `
    <section class="content settingsSection">
      <div class="settingsGrid">
        <!-- Left Column: Event & Owner Settings -->
        <div style="display:flex;flex-direction:column;gap:22px">
          <div class="panel formPanel">
            <span class="eyebrow">EVENT CONFIGURATION</span>
            <h2>Event &amp; Owner Settings</h2>
            <p>Set event details, published date &amp; time, venue and security password. Changes automatically reflect on all ID cards.</p>
            <div class="formGrid">
              <label class="field"><span>Event name <b style="color:#ff8a8a">*</b></span><input id="sName" value="${esc(settings.eventName)}" placeholder="WordPress Community Meetup 2026"></label>
              <label class="field"><span>School / College / Institute Name</span><input id="sInstitute" value="${esc(settings.instituteName||settings.venue||defaults.instituteName)}" placeholder="WordPress Community Bangladesh"><small>আইডি কার্ডের ফ্রন্ট ও ব্যাক পেজের উপরে বড় করে প্রদর্শিত হবে।</small></label>
              <label class="field"><span>Event date <b style="color:#ff8a8a">*</b></span><input type="date" id="sDate" value="${esc(settings.eventDate||'2026-11-11')}"></label>
              <label class="field"><span>Event time <b style="color:#ff8a8a">*</b></span><input id="sTime" value="${esc(settings.eventTime||'06:00 AM')}" placeholder="06:00 AM"></label>
              <label class="field"><span>Venue <b style="color:#ff8a8a">*</b></span><input id="sVenue" value="${esc(settings.venue||'Dhaka, Bangladesh')}" placeholder="Dhaka, Bangladesh"></label>
              <label class="field"><span>Organized By</span><input id="sOrganizedBy" value="${esc(settings.organizedBy||'ThemeOri')}" placeholder="ThemeOri"></label>
              <label class="field"><span>Event Slogan (Front side)</span><input id="sEventSlogan" value="${esc(settings.eventSlogan||'Learn · Connect · Contribute')}" placeholder="Learn · Connect · Contribute"></label>
              <label class="field"><span>Event Quote (Back side)</span><input id="sEventQuote" value="${esc(settings.eventQuote||'Build Together, Grow Together')}" placeholder="Build Together, Grow Together"></label>
              <label class="field"><span>Event Motto (Wave footer)</span><input id="sEventMotto" value="${esc(settings.eventMotto||'OPEN SOURCE · COMMUNITY · WORDPRESS')}" placeholder="OPEN SOURCE · COMMUNITY · WORDPRESS"></label>
              <label class="field"><span>Scanner name</span><input id="sScanner" value="${esc(settings.scannerName||'Registration Desk')}" placeholder="Registration Desk"></label>
              <label class="field"><span>Owner / Client name</span><input id="sOwnerName" value="${esc(settings.ownerName||'')}" placeholder="Event Owner"></label>
              <label class="field"><span>Owner / Client email</span><input type="email" id="sOwnerEmail" value="${esc(settings.ownerEmail||'')}" placeholder="owner@example.com"></label>
              <label class="field"><span>Owner / Client phone</span><input id="sOwnerPhone" value="${esc(settings.ownerPhone||'')}" placeholder="+8801XXXXXXXXX"></label>
            </div>
            <div class="settingsBlock">
              <h3>Email QR delivery</h3>
              <p>For a real email with the QR image embedded, connect EmailJS below. The email service account controls the actual sender mailbox; the owner email is used as the reply-to/contact address.</p>
              <div class="formGrid">
                <label class="field"><span>EmailJS Public Key</span><input id="sEmailPublic" value="${esc(settings.emailPublicKey||'')}" placeholder="Your EmailJS public key"></label>
                <label class="field"><span>EmailJS Service ID</span><input id="sEmailService" value="${esc(settings.emailServiceId||'')}" placeholder="service_xxxxx"></label>
                <label class="field"><span>EmailJS Template ID</span><input id="sEmailTemplate" value="${esc(settings.emailTemplateId||'')}" placeholder="template_xxxxx"></label>
                <label class="field"><span>QR image size</span><input id="sQrSize" value="${esc(settings.qrSize||'400')}" inputmode="numeric" placeholder="400"></label>
              </div>
              <div class="formActions"><button class="secondary" onclick="testEmailConfig()">Send test email</button></div>
            </div>
            <div class="settingsBlock">
              <h3>🔐 Admin Password &amp; Security</h3>
              <p>অ্যাডমিন পাসওয়ার্ড দিয়ে কন্ট্রোল সেন্টার, সেটিংস এবং গেস্ট ডিলিট সুরক্ষিত থাকে। ডিফল্ট পাসওয়ার্ড: <b>12345</b>। নিচে বর্তমান ও নতুন পাসওয়ার্ড দিয়ে পরিবর্তন করতে পারেন।</p>
              <div class="formGrid">
                <label class="field"><span>Current / Old Admin Password</span><div class="passwordWrap"><input type="password" id="sOldAdminPassword" placeholder="Enter current password (default: 12345)"><button type="button" class="toggleEyeBtn" onclick="togglePasswordVisibility('sOldAdminPassword', this)" title="Show/Hide password">${EYE_OPEN_SVG}</button></div><small>পাসওয়ার্ড পরিবর্তনের জন্য বর্তমান পাসওয়ার্ড দিতে হবে।</small></label>
                <label class="field"><span>New Admin Password</span><div class="passwordWrap"><input type="password" id="sNewAdminPassword" placeholder="Leave blank to keep current"><button type="button" class="toggleEyeBtn" onclick="togglePasswordVisibility('sNewAdminPassword', this)" title="Show/Hide password">${EYE_OPEN_SVG}</button></div><small>পরিবর্তন করতে না চাইলে ফাঁকা রাখুন (সর্বনিম্ন ৪ অক্ষর)।</small></label>
              </div>
            </div>
            <div class="formActions"><button class="primary" onclick="saveSettings()">Save settings</button></div>
          </div>
          <div class="panel note">
            <h3>One-time QR verification</h3>
            <p>Every guest has an immutable serial number, permanent Guest ID, unique entry code and QR value. The first valid scan changes the status to Verified / Attended and stores the scanner name + time. Any later scan shows <b>Already Attended</b> and is blocked. All Guests and Checked In are separate views.</p>
          </div>
        </div>

        <!-- Right Column: Registration Form Fields Builder -->
        <div>
          ${formBuilderHTML}
        </div>
      </div>
    </section>
  `;
}
async function saveSettings(){
  const oldPass=document.getElementById('sOldAdminPassword')?.value||'';
  const newPass=document.getElementById('sNewAdminPassword')?.value||'';
  if(newPass){
    if(!oldPass){toast('Please enter current admin password to set a new password','bad');return}
    const oldHash=await hashText(oldPass);
    const expected=settings.adminPasswordHash||'5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
    if(oldHash!==expected){toast('Current admin password is incorrect!','bad');return}
    if(newPass.length<4){toast('New password must be at least 4 characters','bad');return}
    settings.adminPasswordHash=await hashText(newPass);
    toast('Admin password updated successfully! ✓');
  }
  settings={
    ...settings,
    eventName:document.getElementById('sName').value||defaults.eventName,
    instituteName:document.getElementById('sInstitute')?.value||document.getElementById('sVenue')?.value||defaults.instituteName,
    eventDate:document.getElementById('sDate').value||defaults.eventDate,
    eventTime:document.getElementById('sTime').value||defaults.eventTime,
    venue:document.getElementById('sVenue').value||'',
    organizedBy:document.getElementById('sOrganizedBy').value||defaults.organizedBy,
    eventSlogan:document.getElementById('sEventSlogan').value||defaults.eventSlogan,
    eventQuote:document.getElementById('sEventQuote').value||defaults.eventQuote,
    eventMotto:document.getElementById('sEventMotto').value||defaults.eventMotto,
    scannerName:document.getElementById('sScanner')?.value||defaults.scannerName,
    ownerName:document.getElementById('sOwnerName').value||'',
    ownerEmail:document.getElementById('sOwnerEmail').value||'',
    ownerPhone:document.getElementById('sOwnerPhone').value||'',
    emailPublicKey:document.getElementById('sEmailPublic').value.trim(),
    emailServiceId:document.getElementById('sEmailService').value.trim(),
    emailTemplateId:document.getElementById('sEmailTemplate').value.trim(),
    qrSize:document.getElementById('sQrSize').value.replace(/\D/g,'')||'400'
  };
  save();
  toast('Settings saved');
  render();
}
function qrImageUrl(u,size=settings.qrSize||'400'){return 'https://api.qrserver.com/v1/create-qr-code/?size='+encodeURIComponent(size)+'x'+encodeURIComponent(size)+'&data='+encodeURIComponent(u.qrValue)}
function emailParams(u){const qr=qrImageUrl(u);return {to_email:u.email,to_name:u.name,reply_to:settings.ownerEmail||'',from_name:settings.ownerName||settings.eventName,owner_name:settings.ownerName||settings.eventName,owner_email:settings.ownerEmail||'',owner_phone:settings.ownerPhone||'',event_name:settings.eventName,event_date:fmtDateTime(settings.eventDate,settings.eventTime),venue:settings.venue,guest_name:u.name,guest_serial:String(u.serial).padStart(2,'0'),guest_number:'#'+String(u.serial).padStart(2,'0'),guest_id:u.guestId,entry_code:u.code,qr_code:qr,qr_url:qr,message:inviteMessage(u)}}
async function sendGuestEmail(id){const u=users.find(x=>x.guestId===id);if(!u)return;if(!settings.emailPublicKey||!settings.emailServiceId||!settings.emailTemplateId){toast('Set EmailJS Public Key, Service ID and Template ID in Settings first','bad');navigate('settings');return}try{if(window.emailjs)window.emailjs.init({publicKey:settings.emailPublicKey});await emailjs.send(settings.emailServiceId,settings.emailTemplateId,emailParams(u));toast('QR email sent to '+u.email)}catch(err){toast('Email send failed. Check EmailJS settings/template.','bad');console.error(err)}}
async function testEmailConfig(){const email=settings.ownerEmail||prompt('Enter a test email address');if(!email)return;if(!settings.emailPublicKey||!settings.emailServiceId||!settings.emailTemplateId){toast('Fill EmailJS Public Key, Service ID and Template ID first','bad');return}const fake={name:settings.ownerName||'Event Owner',email,serial:0,guestId:'TEST-GUEST',code:'TEST-0000',qrValue:'EVENTPASS|TEST-GUEST'};try{if(window.emailjs)window.emailjs.init({publicKey:settings.emailPublicKey});await emailjs.send(settings.emailServiceId,settings.emailTemplateId,emailParams(fake));toast('Test email sent')}catch(err){toast('Test email failed. Check your EmailJS template variables.','bad');console.error(err)}}
function exportCSV(){
  const customCols = getFormFields().filter(x => !x.isDefault);
  const customHeaders = customCols.map(c => c.label);
  const baseHeaders = ['Serial','Permanent Guest ID','Name','Total Persons','Primary Guest','Sub-Guests','Guest Type','Entry Type','T-Shirt Size','T-Shirt Claimed','T-Shirt Handover Time','T-Shirt Handover By','Entry Code','ID Card Pass','Phone','Email', ...customHeaders, 'Status','Checked At','Scanner'];
  const rows = [baseHeaders, ...users.sort((a,b)=>a.serial-b.serial).map(u=>{
    const c=getGuestCount(u);
    const sub=Math.max(0,c-1);
    const customValues = customCols.map(col => u.customFields?.[col.id] || '');
    return [u.serial,u.guestId,u.name,c,1,sub,u.guestType||'Individual',u.entryType||'General',getGuestTShirtSize(u),u.tShirtClaimed?'Yes':'No',u.tShirtClaimedAt?formatBDDateTime(u.tShirtClaimedAt):'',u.tShirtClaimedBy||'',u.code,u.idCardPassword||'1234',u.phone,u.email, ...customValues, u.checkedIn?'Checked in':'Pending',u.checkedAt?formatBDDateTime(u.checkedAt):'',u.scanner||''];
  })];
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='event-guests.csv';
  a.click();
}
function fmtDate(v){try{return new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch{return v}}
function fmtDateTime(d,t){const dp=fmtDate(d);return t&&String(t).trim()?`${dp} · ${String(t).trim()}`:dp}
let lastStoredUsersRaw = localStorage.getItem(USERS_KEY) || '';
function syncFromStorage(){
  try{
    const currentRaw = localStorage.getItem(USERS_KEY) || '';
    if(currentRaw !== lastStoredUsersRaw){
      lastStoredUsersRaw = currentRaw;
      reloadUsersFromStorage();
      refreshLiveViews();
    }
  }catch(e){}
}
function refreshLiveViews(){
  if(isGateMode && currentVolunteer){
    if(activeVolunteerTab === 'tshirt'){
      refreshTShirtRecentList();
      const stats = getTShirtStats();
      const statsPill = document.querySelector('.gateStatsPill');
      if(statsPill) statsPill.innerHTML = `🎽 Handed: <b>${stats.claimed}</b> / ${stats.total}`;
      return;
    }
    const v=currentVolunteer;
    const vScans=users.filter(x=>x.checkedIn && x.scanner && x.scanner.includes(v.name));
    const totalGatePersons=vScans.reduce((s,x)=>s+getGuestCount(x),0);
    const statsPill=document.querySelector('.gateStatsPill');
    if(statsPill)statsPill.innerHTML=`📊 Scanned: <b>${vScans.length}</b> (${totalGatePersons} জন)`;
    const recentList=document.querySelector('.gateRecentList');
    if(recentList){
      const recentGateScans=[...vScans].sort((a,b)=>new Date(b.checkedAt)-new Date(a.checkedAt)).slice(0,8);
      recentList.innerHTML=recentGateScans.length ? recentGateScans.map(gx=>{
        const c=getGuestCount(gx);
        return `
          <div class="gateRecentItem">
            <div>
              <b style="color:#fff;display:block">${esc(gx.name)}</b>
              <small style="color:#94a3b8">#${String(gx.serial).padStart(2,'0')} · Batch ${esc(gx.sscBatch||'—')}</small>
            </div>
            <div style="text-align:right">
              <span style="background:#064e3b;color:#6ee7b7;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;display:inline-block">👥 ${c} জন</span>
              <small style="display:block;color:#64748b;margin-top:2px">${formatBDTime(gx.checkedAt)}</small>
            </div>
          </div>
        `;
      }).join('') : `<div style="text-align:center;padding:24px;color:#64748b;font-size:12px">No scans at this gate yet. Scan a QR code to begin.</div>`;
    }
    return;
  }
  if(!isAdmin){
    renderPublicLookup();
    return;
  }
  if(tab==='dashboard'){
    const content=document.querySelector('.content');
    if(content && content.parentElement){
      const h=getHeadcounts();
      content.parentElement.innerHTML=`<header><div><span class="eyebrow">EVENT CONTROL CENTER</span><h1>Dashboard</h1></div><div class="headerActions"><div class="cloudStatusContainer"></div><span class="adminBadge">🔐 ADMIN</span><div class="eventChip"><span>EVENT</span><b>${esc(settings.eventName)}</b></div><button class="secondary" onclick="openCloudModal()" title="ক্লাউড ডাটাবেজ সেটিংস">☁️ Cloud Sync</button><button class="primary" onclick="openAdd()">＋ Add Guest</button><button class="secondary logoutBtn" onclick="logoutAdmin()" title="Logout Admin">🔓 Logout</button></div></header>${dashboardHTML(h)}`;
    }
  }else if(tab==='guests'){
    renderGuestsOnly();
  }else if(tab==='tshirt'){
    renderTShirtOnly();
  }else if(tab==='tshirt_scanner'){
    refreshTShirtRecentList();
  }
}
window.addEventListener('storage', e => {
  if(!e.key || e.key === USERS_KEY || e.key === SETTINGS_KEY){
    syncFromStorage();
  }
});
window.addEventListener('focus', () => {
  syncFromStorage();
});
setInterval(syncFromStorage, 1000);
window.addEventListener('beforeunload',()=>{stopScanner();stopGateScanner();});
render();
normalizeExistingPhotos();
initFirebase();
setTimeout(updateCloudStatusUI, 100);
</script>
</body></html>
